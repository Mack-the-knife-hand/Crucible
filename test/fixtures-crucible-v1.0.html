  <style>
/* =============================================================================
   Crucible — styles
   Theme: a forge. Charcoal and soot, with ember orange for anything "hot"
   (AI actions, pending changes). Light theme is warm parchment.
   ============================================================================= */

:root {
  --bg: #17151a;
  --bg-2: #1e1b21;
  --panel: #221f26;
  --panel-2: #2a2630;
  --line: #36313d;
  --text: #e9e3da;
  --muted: #9b93a3;
  --ember: #e8743b;
  --ember-2: #f4a259;
  --ember-glow: rgba(232, 116, 59, 0.18);
  --ok: #7fb685;
  --warn: #e3b448;
  --bad: #d9665b;
  --sel: rgba(244, 162, 89, 0.32);
  --mark: rgba(244, 162, 89, 0.45);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  --editor-size: 17px;
  --radius: 7px;
}

[data-theme="light"] {
  --bg: #efe8dc;
  --bg-2: #f6f1e8;
  --panel: #f9f5ee;
  --panel-2: #efe7da;
  --line: #d9cdbb;
  --text: #2b241d;
  --muted: #7a6d5f;
  --ember: #c4541f;
  --ember-2: #b8661f;
  --ember-glow: rgba(196, 84, 31, 0.12);
  --sel: rgba(196, 84, 31, 0.22);
  --mark: rgba(196, 84, 31, 0.3);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13.5px/1.45 var(--sans);
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
}

button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 5px 11px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: default; }
button.accent { background: var(--ember); border-color: var(--ember); color: #1a1208; font-weight: 600; }
button.accent:hover { background: var(--ember-2); border-color: var(--ember-2); }
button.ghost { background: transparent; }
button.small { padding: 3px 8px; font-size: 12px; }
button.danger { color: var(--bad); }
input, select, textarea {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 5px 8px;
}
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ember); outline-offset: -1px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.spacer { flex: 1; }
.check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
.check input { margin: 0; accent-color: var(--ember); }

/* ---------------------------------------------------------------- top bar */
#topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 7px 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand { font: 600 17px var(--serif); letter-spacing: .04em; display: flex; align-items: center; gap: 8px; margin-right: 6px; }
.ember {
  width: 12px; height: 12px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #ffd27a, var(--ember) 55%, #7a2a0c);
  box-shadow: 0 0 10px var(--ember);
}
.group { display: flex; align-items: center; gap: 5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; }
.seg button.on { background: var(--ember-glow); color: var(--ember-2); }
.provider-pick { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.provider-pick select { max-width: 190px; }
.dropdown { position: relative; }
.dropdown .menu {
  display: none; position: absolute; top: 110%; left: 0; z-index: 50; min-width: 320px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}
.dropdown.open .menu { display: block; }
.menu .mi { padding: 6px 9px; border-radius: 5px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu .mi:hover { background: var(--ember-glow); }

/* -------------------------------------------------------------- workspace */
#workspace {
  display: grid;
  grid-template-columns: 290px 1fr 390px;
  min-height: 0;
}
.panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
#workspace > * { min-width: 0; }
#left { border-right: 1px solid var(--line); }
#right { border-left: 1px solid var(--line); }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 6px; }
.tabs button {
  border: 0; border-radius: 0; background: transparent; color: var(--muted);
  padding: 9px 10px 8px; border-bottom: 2px solid transparent;
}
.tabs button.on { color: var(--text); border-bottom-color: var(--ember); }
.badge {
  display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 3px;
  border-radius: 9px; background: var(--panel-2); color: var(--muted); font-size: 11px; text-align: center;
}
.tabs button.on .badge { background: var(--ember-glow); color: var(--ember-2); }
.tab { display: none; flex-direction: column; flex: 1; min-height: 0; min-width: 0; }
.tab.on { display: flex; }
.toolbar { display: flex; align-items: center; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.toolbar input:not([type="checkbox"]):not([type="radio"]) { flex: 1; min-width: 80px; }
.toolbar .check { line-height: 1.3; }
.list { overflow-y: auto; flex: 1; padding: 6px; }
.empty { color: var(--muted); padding: 18px 12px; text-align: center; font-size: 12.5px; line-height: 1.6; }

/* outline */
.ol-item { padding: 4px 8px; border-radius: 5px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ol-item:hover { background: var(--panel-2); }
.ol-item.cur { background: var(--ember-glow); color: var(--ember-2); }
.ol-item .wc { float: right; color: var(--muted); font-size: 11px; margin-left: 6px; }
.ol-1 { font-weight: 600; }
.ol-2 { padding-left: 20px; }
.ol-3 { padding-left: 34px; color: var(--muted); }

/* cards (pool, links, memory) */
.card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 9px;
  margin-bottom: 7px;
  min-width: 0;
  overflow-wrap: anywhere;
}
.card.pending { border-left-color: var(--ember); }
.card.negotiating { border-left-color: var(--warn); }
.card.applied { border-left-color: var(--ok); opacity: .8; }
.card.dismissed { opacity: .5; }
.card.missing { border-left-color: var(--bad); }
.card .row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.card .row > .tag:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.card .snippet {
  font: 13px/1.5 var(--serif);
  max-height: 4.6em; overflow: hidden;
  margin: 4px 0; cursor: pointer;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
}
.card .note { font-size: 12px; color: var(--muted); font-style: italic; }
.card .actions { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.card .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.card .tag.st-pending { color: var(--ember-2); }
.card .tag.st-applied { color: var(--ok); }
.card .tag.st-missing { color: var(--bad); }
.card .tag.st-negotiating { color: var(--warn); }

/* ----------------------------------------------------------------- editor */
#center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
#findBar { display: flex; gap: 5px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
#findBar input { width: 190px; }
#editorWrap { flex: 1; display: grid; min-height: 0; }
#editorWrap[data-view="edit"] { grid-template-columns: 1fr; }
#editorWrap[data-view="edit"] #previewPane { display: none; }
#editorWrap[data-view="preview"] #editorPane { display: none; }
#editorWrap[data-view="split"] { grid-template-columns: 1fr 1fr; }
#editorWrap[data-view="split"] #previewPane { border-left: 1px solid var(--line); }
#editorPane, #previewPane { min-height: 0; overflow: hidden; display: flex; }
#editor {
  flex: 1;
  border: 0; border-radius: 0; resize: none;
  background: var(--bg);
  padding: 44px max(6%, calc((100% - 74ch) / 2)) 40vh;
  font: var(--editor-size)/1.75 var(--serif);
  tab-size: 4;
  outline: none;
  caret-color: var(--ember);
}
#editor::selection { background: var(--sel); }
#editor:focus { outline: none; }
#previewPane { overflow-y: auto; display: block; }

.manuscript {
  max-width: 68ch; margin: 0 auto; padding: 44px 6% 30vh;
  font: var(--editor-size)/1.75 var(--serif);
}
.manuscript h1 { font-size: 1.9em; text-align: center; margin: 2.2em 0 1em; font-weight: 500; letter-spacing: .02em; }
.manuscript h2 { font-size: 1.4em; margin: 1.8em 0 .7em; font-weight: 500; }
.manuscript h3 { font-size: 1.15em; margin: 1.5em 0 .5em; }
.manuscript p { margin: 0 0 .9em; }
.manuscript hr { border: 0; text-align: center; margin: 2em 0; }
.manuscript hr::after { content: "*   *   *"; color: var(--muted); letter-spacing: .3em; }
.manuscript blockquote { border-left: 3px solid var(--line); margin: 1em 0; padding: 0 1em; color: var(--muted); }
.manuscript img { max-width: 100%; }

#statusbar {
  display: flex; gap: 16px; align-items: center;
  padding: 4px 12px; font-size: 12px; color: var(--muted);
  background: var(--panel); border-top: 1px solid var(--line);
}
#stDirty { color: var(--ember-2); }
#stLinked { color: var(--ember-2); cursor: pointer; }

/* ------------------------------------------------------------------- AI */
#aiContext { padding: 8px; border-bottom: 1px solid var(--line); max-height: 34%; overflow-y: auto; }
#aiContext:empty { display: none; }
.ctx-head { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 6px; display: flex; }
.ctx-item {
  font: 12.5px/1.45 var(--serif); padding: 6px 8px; margin-bottom: 5px;
  border-radius: 5px; background: var(--ember-glow); border: 1px solid transparent;
  display: flex; gap: 6px;
}
.ctx-item .t { flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.ctx-item button { padding: 0 6px; height: 20px; font-size: 11px; }
#chatLog { flex: 1; overflow-y: auto; padding: 10px; }
.msg { margin-bottom: 12px; }
.msg .who { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 3px; }
.msg.user .body { background: var(--panel-2); border-radius: var(--radius); padding: 8px 10px; white-space: pre-wrap; }
.msg.assistant .body { line-height: 1.55; }
.msg.assistant .body p { margin: 0 0 .6em; }
.msg.assistant .body pre { background: var(--bg-2); padding: 8px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; }
.msg.error .body { color: var(--bad); }
.msg.thinking .body::after { content: "…"; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }

.revision {
  border: 1px solid var(--ember); border-radius: var(--radius);
  margin: 8px 0; overflow: hidden; background: var(--bg-2);
}
.revision .rv-head { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: var(--ember-glow); font-size: 12px; }
.revision .rv-body { padding: 8px 10px; font: 13.5px/1.6 var(--serif); white-space: pre-wrap; }
.revision .rv-diff { padding: 8px 10px; font: 13.5px/1.6 var(--serif); white-space: pre-wrap; border-top: 1px dashed var(--line); }
.revision del { background: rgba(217,102,91,.22); color: var(--bad); text-decoration: line-through; }
.revision ins { background: rgba(127,182,133,.22); color: var(--ok); text-decoration: none; }
.revision.applied { border-color: var(--ok); }
.revision.applied .rv-head { background: rgba(127,182,133,.15); }

#chatInputWrap { border-top: 1px solid var(--line); padding: 8px; display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.chat-opts { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.chat-opts button { margin-left: auto; }
#chatInput { height: 76px; resize: vertical; }
#btnSend { align-self: end; }

/* ---------------------------------------------------------------- memory */
.mem-thumb { width: 100%; max-height: 150px; object-fit: cover; border-radius: 5px; cursor: zoom-in; margin: 4px 0; display: block; }
.card textarea { width: 100%; resize: vertical; font-size: 12px; margin-top: 4px; }
.card input.tags { width: 100%; font-size: 12px; margin-top: 4px; }
.card .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------------------------------------------------------- player */
#player {
  display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center;
  padding: 7px 14px; background: var(--panel); border-top: 1px solid var(--line);
}
.pl-controls { display: flex; gap: 4px; }
.pl-controls button { width: 34px; height: 30px; padding: 0; background: transparent; }
.pl-controls button.play { background: var(--ember); color: #1a1208; border-color: var(--ember); }
.pl-controls button.on { color: var(--ember-2); border-color: var(--ember); }
.pl-track { min-width: 0; }
#plTitle { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-seek { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.pl-seek input { flex: 1; }
.pl-right { display: flex; align-items: center; gap: 8px; }
#plVol { width: 100px; }
input[type="range"] { accent-color: var(--ember); padding: 0; border: 0; background: transparent; }
#playlistPanel {
  position: fixed; right: 14px; bottom: 58px; width: 400px; max-height: 55vh; z-index: 40;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column; box-shadow: 0 16px 40px rgba(0,0,0,.4);
}
.pl-item { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 5px; cursor: pointer; }
.pl-item:hover { background: var(--panel-2); }
.pl-item.cur { color: var(--ember-2); background: var(--ember-glow); }
.pl-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-item button { padding: 0 6px; height: 20px; font-size: 11px; opacity: 0; }
.pl-item:hover button { opacity: 1; }

/* ---------------------------------------------------------- context menu */
#ctxMenu {
  position: fixed; z-index: 100; min-width: 230px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 4px; box-shadow: 0 12px 34px rgba(0,0,0,.45);
}
#ctxMenu .mi { padding: 6px 10px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; }
#ctxMenu .mi:hover { background: var(--ember-glow); }
#ctxMenu .mi.hot { color: var(--ember-2); }
#ctxMenu .mi .k { margin-left: auto; color: var(--muted); font-size: 11px; }
#ctxMenu .sep { height: 1px; background: var(--line); margin: 4px 2px; }
#ctxMenu .mi.disabled { opacity: .4; pointer-events: none; }

/* ----------------------------------------------------------------- modal */
.modal-back {
  position: fixed; inset: 0; z-index: 200; background: rgba(10,8,12,.55);
  display: flex; align-items: center; justify-content: center;
}
.modal {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  width: min(640px, 92vw); max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.modal.wide { width: min(980px, 95vw); }
.modal header { padding: 14px 18px 8px; font: 600 16px var(--serif); display: flex; align-items: center; }
.modal .mbody { padding: 6px 18px 14px; overflow-y: auto; }
.modal footer { padding: 10px 18px 14px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line); }
.field { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: center; margin: 8px 0; }
.field label { color: var(--muted); }
.field .hint { grid-column: 2; font-size: 11.5px; color: var(--muted); margin-top: -4px; }
.prov-card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--bg-2); }
.prov-card.active { border-color: var(--ember); }
.lightbox img { max-width: 90vw; max-height: 82vh; display: block; border-radius: 6px; }
.lightbox { background: transparent; border: 0; box-shadow: none; width: auto; align-items: center; }
.lightbox .cap { color: #eee; margin-top: 8px; text-align: center; }
.pick-list .mi { padding: 7px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; display: flex; align-items: center; gap: 8px; }
.pick-list .mi:hover { background: var(--ember-glow); border-color: var(--line); }
.pick-list img { width: 48px; height: 36px; object-fit: cover; border-radius: 4px; }
.backup-view { display: grid; grid-template-columns: 260px 1fr; gap: 10px; height: 60vh; }
.backup-view pre { margin: 0; overflow: auto; background: var(--bg-2); padding: 10px; border-radius: 6px; font: 12.5px/1.5 var(--serif); white-space: pre-wrap; }

/* ----------------------------------------------------------------- toast */
#toast {
  position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%) translateY(20px);
  background: var(--panel-2); border: 1px solid var(--line); padding: 8px 16px; border-radius: 20px;
  opacity: 0; pointer-events: none; transition: all .2s; z-index: 300;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { border-color: var(--bad); color: var(--bad); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

@media (max-width: 1250px) {
  #workspace { grid-template-columns: 240px 1fr 330px; }
}

</style>

<body>
  <!-- ============================== TOP BAR ============================== -->
  <header id="topbar">
    <div class="brand"><span class="ember"></span>Crucible</div>
    <div class="group">
      <button id="btnNew" title="New manuscript">New</button>
      <button id="btnOpen" title="Open a Markdown manuscript (Ctrl+O)">Open book</button>
      <div class="dropdown">
        <button id="btnRecent" title="Recent books">▾</button>
        <div class="menu" id="recentMenu"></div>
      </div>
      <button id="btnSave" title="Save (Ctrl+S)">Save</button>
      <button id="btnSaveAs" title="Save to a new file">Save as</button>
      <button id="btnBackups" title="Restore an earlier version">Backups</button>
      <button id="btnDownload" class="hidden" title="Download a copy of the manuscript (.md)">Download .md</button>
    </div>
    <div class="group">
      <div class="seg" id="viewSeg">
        <button data-view="edit" class="on">Write</button>
        <button data-view="split">Split</button>
        <button data-view="preview">Read</button>
      </div>
      <button id="btnFind" title="Find & replace (Ctrl+F)">Find</button>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <label class="provider-pick" title="Which AI answers in the negotiation box">
        <span>AI</span>
        <select id="providerSelect"></select>
      </label>
      <button id="btnExport" class="accent" title="Export the book as a PDF">Export PDF</button>
      <button id="btnTheme" title="Toggle light/dark">Light</button>
      <button id="btnSettings" title="AI providers & preferences">Settings</button>
    </div>
  </header>

  <!-- ============================== MAIN ============================== -->
  <main id="workspace">
    <!-- Left: outline / change pool / links -->
    <aside id="left" class="panel">
      <nav class="tabs" data-for="left">
        <button data-tab="outline" class="on">Outline</button>
        <button data-tab="pool">Change pool <span class="badge" id="poolBadge">0</span></button>
        <button data-tab="links">Links <span class="badge" id="linkBadge">0</span></button>
      </nav>
      <section class="tab on" data-tab="outline">
        <div id="outline" class="list"></div>
      </section>
      <section class="tab" data-tab="pool">
        <div class="toolbar">
          <select id="poolFilter">
            <option value="open">Open items</option>
            <option value="all">All items</option>
            <option value="applied">Applied</option>
            <option value="dismissed">Dismissed</option>
          </select>
          <button id="btnNegotiateSel" class="accent small" title="Send checked items to the AI box">Negotiate ✓</button>
        </div>
        <div id="poolList" class="list"></div>
      </section>
      <section class="tab" data-tab="links">
        <div class="toolbar">
          <label class="check"><input type="checkbox" id="ambientToggle"> Auto-play song for the passage I'm in</label>
        </div>
        <div id="linkList" class="list"></div>
      </section>
    </aside>

    <!-- Center: manuscript -->
    <section id="center">
      <div id="findBar" class="hidden">
        <input id="findInput" placeholder="Find…">
        <input id="replaceInput" placeholder="Replace with…">
        <label class="check"><input type="checkbox" id="findCase"> Aa</label>
        <button id="findPrev">↑</button>
        <button id="findNext">↓</button>
        <button id="replaceOne">Replace</button>
        <button id="replaceAll">All</button>
        <span id="findCount" class="muted"></span>
        <button id="findClose">✕</button>
      </div>
      <div id="editorWrap" data-view="edit">
        <div id="editorPane">
          <textarea id="editor" spellcheck="true" placeholder="Open your manuscript (Ctrl+O) or start writing…"></textarea>
        </div>
        <div id="previewPane"><article id="preview" class="manuscript"></article></div>
      </div>
      <div id="statusbar">
        <span id="stFile">No file</span>
        <span id="stDirty"></span>
        <span class="spacer"></span>
        <span id="stLinked" class="hidden"></span>
        <span id="stChapter"></span>
        <span id="stWords">0 words</span>
        <span id="stSel"></span>
      </div>
    </section>

    <!-- Right: AI negotiation / memory -->
    <aside id="right" class="panel">
      <nav class="tabs" data-for="right">
        <button data-tab="ai" class="on">AI desk</button>
        <button data-tab="memory">Story memory <span class="badge" id="memBadge">0</span></button>
      </nav>
      <section class="tab on" data-tab="ai">
        <div id="aiContext"></div>
        <div id="chatLog"></div>
        <div id="chatInputWrap">
          <div class="chat-opts">
            <label class="check" title="Sends the entire manuscript with every message. Uses many tokens on a long book."><input type="checkbox" id="optFullBook"> Include whole manuscript</label>
            <label class="check"><input type="checkbox" id="optMemory" checked> Use story memory</label>
            <button id="btnNewChat" class="small ghost" title="Start a fresh conversation">New chat</button>
          </div>
          <textarea id="chatInput" placeholder="Tell the AI what you want changed… (Ctrl+Enter to send)"></textarea>
          <button id="btnSend" class="accent">Send</button>
        </div>
      </section>
      <section class="tab" data-tab="memory">
        <div class="toolbar">
          <button id="btnAddMemory" class="small">+ Photos / files</button>
          <button id="btnNewNote" class="small">+ New note</button>
          <input id="memSearch" placeholder="Filter…">
        </div>
        <div id="memList" class="list"></div>
      </section>
    </aside>
  </main>

  <!-- ============================== PLAYER ============================== -->
  <footer id="player">
    <div class="pl-controls">
      <button id="plPrev" title="Previous">⏮</button>
      <button id="plPlay" class="play" title="Play / pause">▶</button>
      <button id="plNext" title="Next">⏭</button>
      <button id="plShuffle" title="Shuffle">⤮</button>
      <button id="plRepeat" title="Repeat">↻</button>
    </div>
    <div class="pl-track">
      <div id="plTitle">No song loaded</div>
      <div class="pl-seek">
        <span id="plCur">0:00</span>
        <input type="range" id="plSeek" min="0" max="1000" value="0">
        <span id="plDur">0:00</span>
      </div>
    </div>
    <div class="pl-right">
      <input type="range" id="plVol" min="0" max="1" step="0.01" title="Volume">
      <button id="plListBtn" title="Playlist">☰ Playlist</button>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </footer>

  <div id="playlistPanel" class="hidden">
    <div class="toolbar">
      <strong>Playlist</strong>
      <span class="spacer"></span>
      <button id="plAddFiles" class="small">+ Songs</button>
      <button id="plAddFolder" class="small">+ Folder</button>
      <button id="plClear" class="small ghost">Clear</button>
    </div>
    <div id="playlist" class="list"></div>
  </div>

  <!-- ============================== OVERLAYS ============================== -->
  <div id="ctxMenu" class="hidden"></div>
  <div id="modalRoot"></div>
  <div id="toast"></div>

  <script>/* js/util.js */
// =============================================================================
// util.js — small helpers shared by every module
// =============================================================================

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function uid() {
  return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Build an element: el('div', {class:'x', onclick: fn}, 'text', childEl, ...)
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'value') n.value = v;
    else if (k === 'checked') n.checked = !!v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}

// Convert a disk path (Windows or POSIX) into a file:// URL the window can load.
function fileUrl(p) {
  if (!p) return '';
  let s = p.replace(/\\/g, '/');
  if (!s.startsWith('/')) s = '/' + s;
  return 'file://' + encodeURI(s).replace(/#/g, '%23').replace(/\?/g, '%3F');
}

// Turn a stored media reference into something <img>/<audio> can load.
// Desktop: a disk path -> file:// URL. Browser: a reference -> blob: URL.
async function mediaUrl(p) {
  return window.crucible.urlFor ? window.crucible.urlFor(p) : fileUrl(p);
}

// Pickers return either plain paths (desktop) or {path, name} (browser).
function asPick(p) {
  if (!p) return null;
  return typeof p === 'string' ? { path: p, name: baseName(p) } : p;
}

function baseName(p) {
  return (p || '').split(/[\\/]/).pop();
}

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function countWords(s) {
  const m = (s || '').match(/[A-Za-z0-9À-ɏ'’-]+/g);
  return m ? m.length : 0;
}

function fmtTime(sec) {
  if (!isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function snippet(s, n = 160) {
  s = (s || '').replace(/\s+/g, ' ').trim();
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

let toastTimer;
function toast(msg, isErr = false, ms = 2600) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ''), ms);
}

// ------------------------------------------------------------------ modals --
// openModal({title, body: Node, buttons:[{label, accent, onClick -> false keeps open}], wide})
function openModal({ title, body, buttons = [{ label: 'Close' }], wide = false, cls = '' }) {
  const back = el('div', { class: 'modal-back' });
  const close = () => back.remove();
  const footer = el('footer');
  for (const b of buttons) {
    footer.append(el('button', {
      class: (b.accent ? 'accent ' : '') + (b.cls || ''),
      onclick: async () => {
        const r = b.onClick ? await b.onClick(close) : undefined;
        if (r !== false) close();
      },
    }, b.label));
  }
  const modal = el('div', { class: `modal ${wide ? 'wide' : ''} ${cls}` },
    title ? el('header', {}, title) : null,
    el('div', { class: 'mbody' }, body),
    buttons.length ? footer : null);
  back.append(modal);
  back.addEventListener('mousedown', (e) => { if (e.target === back) close(); });
  const onKey = (e) => {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey, true); }
  };
  document.addEventListener('keydown', onKey, true);
  $('#modalRoot').append(back);
  setTimeout(() => modal.querySelector('input,textarea,select')?.focus(), 30);
  return { close, modal };
}

function promptModal(title, label, initial = '', multiline = false) {
  return new Promise((resolve) => {
    const input = multiline
      ? el('textarea', { rows: 4, style: 'width:100%' })
      : el('input', { style: 'width:100%' });
    input.value = initial;
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    const { close } = openModal({
      title,
      body: el('div', {}, label ? el('p', { class: 'muted' }, label) : null, input),
      buttons: [
        { label: 'Cancel', onClick: () => finish(null) },
        { label: 'OK', accent: true, onClick: () => finish(input.value) },
      ],
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (!multiline || e.ctrlKey)) { e.preventDefault(); finish(input.value); close(); }
    });
    // Resolve null if the modal is dismissed another way.
    const obs = new MutationObserver(() => { if (!document.body.contains(input)) { finish(null); obs.disconnect(); } });
    obs.observe($('#modalRoot'), { childList: true });
  });
}

function confirmModal(title, message, okLabel = 'OK') {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    openModal({
      title,
      body: el('p', {}, message),
      buttons: [
        { label: 'Cancel', onClick: () => finish(false) },
        { label: okLabel, accent: true, onClick: () => finish(true) },
      ],
    });
    const obs = new MutationObserver(() => { if (!$('#modalRoot').children.length) { finish(false); obs.disconnect(); } });
    obs.observe($('#modalRoot'), { childList: true });
  });
}

// --------------------------------------------------------------- word diff --
// Word-level diff (longest common subsequence) used to show what an AI
// revision changes. Returns HTML with <del>/<ins>.
function diffWordsHtml(a, b) {
  const A = a.split(/(\s+)/);
  const B = b.split(/(\s+)/);
  if (A.length * B.length > 4_000_000) return null; // too big to diff quickly
  const n = A.length, m = B.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  // Walk the table into a list of operations: '=' same, '-' removed, '+' added.
  const ops = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { ops.push(['=', A[i]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) ops.push(['-', A[i++]]);
    else ops.push(['+', B[j++]]);
  }
  while (i < n) ops.push(['-', A[i++]]);
  while (j < m) ops.push(['+', B[j++]]);

  // Group each run of changes into one removed phrase + one added phrase.
  // Unchanged spaces between two changes are absorbed into the run.
  let out = '', del = '', ins = '';
  const flush = () => {
    if (del) out += `<del>${escapeHtml(del)}</del>`;
    if (ins) out += `<ins>${escapeHtml(ins)}</ins>`;
    del = ins = '';
  };
  for (let k = 0; k < ops.length; k++) {
    const [op, tok] = ops[k];
    if (op === '-') del += tok;
    else if (op === '+') ins += tok;
    else if ((del || ins) && /^\s+$/.test(tok) && ops[k + 1] && ops[k + 1][0] !== '=') { del += tok; ins += tok; }
    else { flush(); out += escapeHtml(tok); }
  }
  flush();
  return out;
}

// Strip anything active from HTML produced from AI text before inserting it.
function sanitizeHtml(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  tpl.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach((n) => n.remove());
  tpl.content.querySelectorAll('*').forEach((n) => {
    for (const a of [...n.attributes]) {
      if (/^on/i.test(a.name) || /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name);
    }
  });
  return tpl.innerHTML;
}

// Pure helpers used by the editor; kept here so they can be unit-tested.
const TextOps = {
  // Find the changed region between two versions of the text.
  changedRegion(oldT, newT) {
    let p = 0;
    const minLen = Math.min(oldT.length, newT.length);
    while (p < minLen && oldT.charCodeAt(p) === newT.charCodeAt(p)) p++;
    let s = 0;
    while (s < minLen - p && oldT.charCodeAt(oldT.length - 1 - s) === newT.charCodeAt(newT.length - 1 - s)) s++;
    return { start: p, oldEnd: oldT.length - s, newEnd: newT.length - s };
  },

  // Move a stored {start,end} range so it still points at the same words after an edit.
  shiftRange(r, ch) {
    const delta = (ch.newEnd - ch.start) - (ch.oldEnd - ch.start);
    if (r.end <= ch.start) return r;                                   // edit is after the range
    if (r.start >= ch.oldEnd) return { start: r.start + delta, end: r.end + delta }; // edit is before
    if (ch.start >= r.start && ch.oldEnd <= r.end) return { start: r.start, end: r.end + delta }; // edit inside
    // partial overlap: stretch the range to cover the edited span
    return { start: Math.min(r.start, ch.start), end: Math.max(ch.newEnd, r.end + delta) };
  },

  // Find where a stored passage is now. Prefers the stored offset, else the
  // occurrence closest to it.
  locate(text, item) {
    if (!item.text) return null;
    if (text.substr(item.start, item.text.length) === item.text) return item.start;
    let best = null, idx = text.indexOf(item.text);
    while (idx !== -1) {
      if (best === null || Math.abs(idx - item.start) < Math.abs(best - item.start)) best = idx;
      idx = text.indexOf(item.text, idx + 1);
    }
    return best;
  },

  // Headings → outline entries with offsets and section word counts.
  outline(text) {
    const out = [];
    const re = /^(#{1,3})[ \t]+(.+?)[ \t#]*$/gm;
    let m;
    while ((m = re.exec(text))) out.push({ level: m[1].length, title: m[2], offset: m.index });
    out.forEach((h, i) => {
      const end = i + 1 < out.length ? out[i + 1].offset : text.length;
      h.words = countWords(text.slice(h.offset + h.title.length + h.level + 1, end));
    });
    return out;
  },

  // Paragraph (blank-line separated block) around an offset.
  paragraphAt(text, pos) {
    let s = text.lastIndexOf('\n\n', Math.max(0, pos - 1));
    s = s === -1 ? 0 : s + 2;
    let e = text.indexOf('\n\n', pos);
    e = e === -1 ? text.length : e;
    return { start: s, end: e };
  },
};

if (typeof module !== 'undefined') module.exports = { TextOps, diffWordsHtml, countWords };

  <script>/* js/platform-web.js */
// =============================================================================
// platform-web.js — lets Crucible run in a plain browser (Edge / Chrome)
// -----------------------------------------------------------------------------
// The desktop app gets `window.crucible` from preload.js (Electron). In a
// browser there is no Electron, so this file builds the SAME API on top of
// browser features. All the other modules don't know or care which one
// they're talking to.
//
// Two storage modes:
//
//  FOLDER MODE (Edge/Chrome — the normal case)
//    You pick the folder that holds your manuscript. Crucible reads and writes
//    the real .md file, and keeps its data in a "<Book>.crucible" folder beside
//    it — exactly the same layout as the desktop app, so both can open the
//    same book. Browsers ask you to re-allow access to the folder once per
//    session; that's a browser security rule, not something Crucible controls.
//
//  BROWSER-STORAGE MODE (fallback: Firefox/Safari, or if folder access is
//    blocked by policy)
//    The book lives inside the browser's own storage (IndexedDB). Use
//    "Download .md" to get the file out. Clearing browser data erases it.
//
// Media references (songs, linked pictures, memory photos) can't be stored as
// disk paths in a browser, so they're stored as short reference strings:
//    mem:<file>        a file in the open book's memory folder
//    h:<id>            a single file you picked (handle saved in IndexedDB)
//    df:<dirId>/<rel>  a song inside a music folder you added
//    sess:<id>         picked without folder access — this session only
// =============================================================================

(function () {
  if (window.crucible) return; // running inside the desktop app

  const hasFSA = typeof window.showDirectoryPicker === 'function';
  const idOf = () => Math.random().toString(36).slice(2, 10);
  const MAX_BACKUPS = 30;

  // ------------------------------------------------------------ IndexedDB --
  const DB = {
    _db: null,
    open() {
      if (this._db) return Promise.resolve(this._db);
      return new Promise((res, rej) => {
        const r = indexedDB.open('crucible', 1);
        r.onupgradeneeded = () => {
          r.result.createObjectStore('kv');   // settings, handles, recent
          r.result.createObjectStore('vfs');  // browser-storage-mode files
        };
        r.onsuccess = () => res((this._db = r.result));
        r.onerror = () => rej(r.error);
      });
    },
    async tx(store, mode, fn) {
      const db = await this.open();
      return new Promise((res, rej) => {
        const t = db.transaction(store, mode);
        const req = fn(t.objectStore(store));
        t.oncomplete = () => res(req && req.result);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error || new Error('Storage aborted (browser storage full?)'));
      });
    },
    get: (s, k) => DB.tx(s, 'readonly', (o) => o.get(k)),
    set: (s, k, v) => DB.tx(s, 'readwrite', (o) => o.put(v, k)),
    del: (s, k) => DB.tx(s, 'readwrite', (o) => o.delete(k)),
    keys: (s) => DB.tx(s, 'readonly', (o) => o.getAllKeys()),
  };

  async function ensurePerm(handle, mode = 'read') {
    if (!handle.queryPermission) return true;
    if ((await handle.queryPermission({ mode })) === 'granted') return true;
    try {
      return (await handle.requestPermission({ mode })) === 'granted';
    } catch {
      return false; // no user gesture available
    }
  }

  // ------------------------------------------------------- storage roots --
  // A "root" is the folder that holds the book. Same methods for both modes.
  class FolderRoot {
    constructor(dir) { this.dir = dir; this.kind = 'folder'; }
    async _parent(rel, create) {
      const parts = rel.split('/').filter(Boolean);
      const name = parts.pop();
      let d = this.dir;
      for (const p of parts) d = await d.getDirectoryHandle(p, { create });
      return { d, name };
    }
    async read(rel, blob = false) {
      try {
        const { d, name } = await this._parent(rel, false);
        const f = await (await d.getFileHandle(name)).getFile();
        return blob ? f : await f.text();
      } catch { return null; }
    }
    async write(rel, data) {
      const { d, name } = await this._parent(rel, true);
      const fh = await d.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(data);
      await w.close();
    }
    async list(relDir) {
      try {
        let d = this.dir;
        for (const p of relDir.split('/').filter(Boolean)) d = await d.getDirectoryHandle(p);
        const out = [];
        for await (const [name, h] of d.entries()) if (h.kind === 'file') out.push(name);
        return out;
      } catch { return []; }
    }
    async remove(rel) {
      try { const { d, name } = await this._parent(rel, false); await d.removeEntry(name); } catch { /* gone */ }
    }
    async exists(rel) { return (await this.read(rel, true)) !== null; }
  }

  class BrowserRoot {
    constructor(prefix) { this.prefix = prefix; this.kind = 'browser'; }
    async read(rel, blob = false) {
      const v = await DB.get('vfs', this.prefix + rel);
      if (v === undefined) return null;
      if (blob) return v instanceof Blob ? v : new Blob([v]);
      return v instanceof Blob ? v.text() : v;
    }
    write(rel, data) { return DB.set('vfs', this.prefix + rel, data); }
    async list(relDir) {
      const pre = this.prefix + relDir.replace(/\/?$/, '/');
      return (await DB.keys('vfs')).filter((k) => k.startsWith(pre) && !k.slice(pre.length).includes('/')).map((k) => k.slice(pre.length));
    }
    remove(rel) { return DB.del('vfs', this.prefix + rel); }
    async exists(rel) { return (await DB.get('vfs', this.prefix + rel)) !== undefined; }
  }

  // The open book: key looks like "Folder/Book.md" (also what you see in the UI).
  const books = new Map(); // key -> { root, file }
  const sidecarOf = (file) => file.replace(/\.[^.]+$/, '') + '.crucible';
  const bookOf = (key) => {
    const b = books.get(key);
    if (!b) throw new Error('That book is no longer open — open it again.');
    return b;
  };

  async function rememberBook(key, root, file) {
    books.set(key, { root, file });
    if (root.kind === 'folder') await DB.set('kv', 'book:' + key, { dir: root.dir, file });
    else await DB.set('kv', 'book:' + key, { browser: root.prefix, file });
    const s = await loadSettings();
    s.recent = [key, ...(s.recent || []).filter((r) => r !== key)].slice(0, 10);
    await DB.set('kv', 'settings', s);
  }

  async function loadAt(key) {
    const { root, file } = bookOf(key);
    const text = await root.read(file);
    if (text === null) throw new Error(`Couldn't read ${file}`);
    let project = {};
    try { project = JSON.parse((await root.read(`${sidecarOf(file)}/project.json`)) || '{}'); } catch { /* fresh */ }
    return { path: key, text: text.replace(/\r\n/g, '\n'), project, sidecar: `${key.split('/')[0]}/${sidecarOf(file)}` };
  }

  // Simple choose-from-list modal (uses the shared modal helpers in util.js).
  function chooseFrom(title, items) {
    return new Promise((resolve) => {
      let done = false;
      const finish = (v) => { if (!done) { done = true; resolve(v); } };
      const list = el('div', { class: 'pick-list' });
      let m;
      items.forEach((it) => list.append(el('div', { class: 'mi', onclick: () => { finish(it); m.close(); } }, it)));
      m = openModal({ title, body: list, buttons: [{ label: 'Cancel', onClick: () => finish(null) }] });
      const obs = new MutationObserver(() => { if (!document.body.contains(list)) { finish(null); obs.disconnect(); } });
      obs.observe($('#modalRoot'), { childList: true });
    });
  }

  // <input type=file> picker for browsers without folder access.
  function inputPick({ accept = '', multiple = false } = {}) {
    return new Promise((resolve) => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = accept;
      inp.multiple = multiple;
      inp.onchange = () => resolve([...inp.files]);
      inp.addEventListener('cancel', () => resolve([]));
      inp.click();
    });
  }

  const isAbort = (e) => e && (e.name === 'AbortError');
  let folderBlocked = false; // set if the browser/policy refuses folder access
  const folderMode = () => hasFSA && !folderBlocked;

  async function pickDir(id) {
    try {
      return await window.showDirectoryPicker({ id, mode: 'readwrite' });
    } catch (e) {
      if (isAbort(e)) return null;
      folderBlocked = true;
      toast('Folder access is blocked in this browser — using browser storage instead.', true, 6000);
      return undefined; // signals "fall back"
    }
  }

  // ------------------------------------------------------------- settings --
  function defaultSettings() {
    return { providers: [], activeProviderId: null, playlist: [], volume: 0.7, ui: { theme: 'dark', fontSize: 17, view: 'edit' }, recent: [] };
  }
  async function loadSettings() {
    const s = Object.assign(defaultSettings(), (await DB.get('kv', 'settings')) || {});
    s.ui = Object.assign(defaultSettings().ui, s.ui || {});
    return s;
  }
  function publicSettings(s) {
    return { ...s, providers: s.providers.map((p) => ({ ...p, apiKey: undefined, hasKey: !!p.apiKey })) };
  }
  async function saveSettings(incoming) {
    const cur = await loadSettings();
    const next = { ...cur, ...incoming };
    if (incoming.providers) {
      next.providers = incoming.providers.map((p) => {
        const old = cur.providers.find((o) => o.id === p.id);
        let apiKey = old ? old.apiKey : '';
        if (typeof p.newApiKey === 'string' && p.newApiKey.trim()) apiKey = p.newApiKey.trim();
        const { newApiKey, hasKey, ...rest } = p;
        return { ...rest, id: p.id || idOf(), apiKey };
      });
    }
    await DB.set('kv', 'settings', next);
    return publicSettings(next);
  }

  // ---------------------------------------------------------- media refs --
  const sessionBlobs = new Map(); // sess:<id> -> File
  const urlCache = new Map();     // ref -> object URL
  let currentKey = null;

  async function blobFor(ref) {
    if (ref.startsWith('sess:')) return sessionBlobs.get(ref) || null;
    if (ref.startsWith('mem:')) {
      const { root, file } = bookOf(currentKey);
      return root.read(`${sidecarOf(file)}/memory/${ref.slice(4)}`, true);
    }
    if (ref.startsWith('h:')) {
      const rec = await DB.get('kv', 'handle:' + ref.slice(2));
      if (!rec) return null;
      if (rec.blob) return rec.blob;
      if (!(await ensurePerm(rec.handle))) throw new Error('Permission to read that file was not given.');
      return rec.handle.getFile();
    }
    if (ref.startsWith('df:')) {
      const [dirId, ...rest] = ref.slice(3).split('/');
      const rec = await DB.get('kv', 'dir:' + dirId);
      if (!rec) return null;
      if (!(await ensurePerm(rec.handle))) throw new Error(`Permission to read the "${rec.handle.name}" folder was not given.`);
      let d = rec.handle;
      const parts = rest.map(decodeURIComponent);
      const name = parts.pop();
      for (const p of parts) d = await d.getDirectoryHandle(p);
      return (await d.getFileHandle(name)).getFile();
    }
    return null;
  }

  async function urlFor(ref) {
    if (!ref) return '';
    if (urlCache.has(ref)) return urlCache.get(ref);
    const b = await blobFor(ref);
    if (!b) throw new Error('File not found');
    const u = URL.createObjectURL(b);
    urlCache.set(ref, u);
    return u;
  }

  function forgetUrls(prefix) {
    for (const [k, u] of urlCache) if (k.startsWith(prefix)) { URL.revokeObjectURL(u); urlCache.delete(k); }
  }

  async function exists(ref) {
    if (!ref) return false;
    if (ref.startsWith('sess:')) return sessionBlobs.has(ref);
    if (ref.startsWith('mem:')) return currentKey && books.has(currentKey) && bookOf(currentKey).root.exists(`${sidecarOf(bookOf(currentKey).file)}/memory/${ref.slice(4)}`);
    if (ref.startsWith('h:')) return !!(await DB.get('kv', 'handle:' + ref.slice(2)));
    if (ref.startsWith('df:')) return !!(await DB.get('kv', 'dir:' + ref.slice(3).split('/')[0]));
    return !!(await DB.get('kv', 'book:' + ref));
  }

  // Pick single files and remember them. Returns [{path: ref, name}]
  async function pickFiles(accept, exts, multiple) {
    if (folderMode() && window.showOpenFilePicker) {
      let hs;
      try {
        hs = await window.showOpenFilePicker({ multiple, types: [{ description: 'Files', accept: { [accept]: exts } }] });
      } catch (e) { if (isAbort(e)) return []; hs = null; }
      if (hs) {
        const out = [];
        for (const h of hs) {
          const id = idOf();
          await DB.set('kv', 'handle:' + id, { handle: h });
          out.push({ path: 'h:' + id, name: h.name, file: await h.getFile() });
        }
        return out;
      }
    }
    return (await inputPick({ accept: exts.join(','), multiple })).map((f) => {
      const id = 'sess:' + idOf();
      sessionBlobs.set(id, f);
      return { path: id, name: f.name, file: f };
    });
  }

  const AUDIO = ['.mp3', '.m4a', '.ogg', '.wav', '.flac', '.aac'];
  const IMAGES = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.bmp'];
  const TEXTS = ['.md', '.markdown', '.txt'];
  const extOf = (n) => (n.match(/\.[^.]+$/) || [''])[0].toLowerCase();
  const MIME = { '.png': 'image/png', '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg', '.gif': 'image/gif', '.webp': 'image/webp', '.bmp': 'image/bmp' };

  // ------------------------------------------------------------------ AI --
  function blobToBase64(b) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = () => rej(r.error);
      r.readAsDataURL(b);
    });
  }

  async function callAI({ providerId, system, messages, imageFiles }) {
    const s = await loadSettings();
    const p = s.providers.find((x) => x.id === (providerId || s.activeProviderId));
    if (!p) throw new Error('No AI provider selected. Add one in Settings.');
    const key = p.apiKey || '';
    const images = [];
    for (const f of imageFiles || []) {
      try {
        const b = await blobFor('mem:' + f);
        if (b) images.push({ mime: MIME[extOf(f)] || 'image/png', data: await blobToBase64(b) });
      } catch { /* skip */ }
    }
    const lastUser = messages.map((m) => m.role).lastIndexOf('user');
    const maxTokens = Number(p.maxTokens) || 4096;
    const temperature = p.temperature === '' || p.temperature == null ? undefined : Number(p.temperature);
    const timeoutMs = (Number(p.timeoutSec) || 180) * 1000;
    const trim = (u) => (u || '').replace(/\/+$/, '');
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeoutMs);

    const post = async (url, headers, body) => {
      let r;
      try {
        r = await fetch(url, { method: 'POST', signal: ctl.signal, headers: { 'content-type': 'application/json', ...headers }, body: JSON.stringify(body) });
      } catch (e) {
        if (e.name === 'AbortError') throw new Error(`The AI didn't answer within ${timeoutMs / 1000}s.`);
        throw new Error(`Couldn't reach ${new URL(url).host}. The server may be down, blocked by your network, or not allowing browser requests (for Ollama set OLLAMA_ORIGINS=*; for LM Studio turn on "Enable CORS").`);
      }
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error?.message || j.message || `HTTP ${r.status}`);
      return j;
    };

    try {
      if (p.type === 'anthropic') {
        const msgs = messages.map((m, i) => (i === lastUser && images.length
          ? { role: 'user', content: [...images.map((im) => ({ type: 'image', source: { type: 'base64', media_type: im.mime, data: im.data } })), { type: 'text', text: m.content }] }
          : { role: m.role, content: m.content }));
        const body = { model: p.model, max_tokens: maxTokens, system, messages: msgs };
        if (temperature !== undefined) body.temperature = temperature;
        const j = await post(`${trim(p.baseUrl) || 'https://api.anthropic.com'}/v1/messages`, {
          'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true',
        }, body);
        return (j.content || []).filter((c) => c.type === 'text').map((c) => c.text).join('\n');
      }
      if (p.type === 'gemini') {
        const contents = messages.map((m, i) => {
          const parts = [{ text: m.content }];
          if (i === lastUser) images.forEach((im) => parts.unshift({ inline_data: { mime_type: im.mime, data: im.data } }));
          return { role: m.role === 'assistant' ? 'model' : 'user', parts };
        });
        const base = trim(p.baseUrl) || 'https://generativelanguage.googleapis.com/v1beta';
        const j = await post(`${base}/models/${encodeURIComponent(p.model)}:generateContent`, { 'x-goog-api-key': key }, {
          system_instruction: { parts: [{ text: system }] }, contents,
          generationConfig: { maxOutputTokens: maxTokens, ...(temperature !== undefined ? { temperature } : {}) },
        });
        return (j.candidates?.[0]?.content?.parts || []).map((x) => x.text || '').join('');
      }
      const msgs = [{ role: 'system', content: system }];
      messages.forEach((m, i) => msgs.push(i === lastUser && images.length
        ? { role: 'user', content: [...images.map((im) => ({ type: 'image_url', image_url: { url: `data:${im.mime};base64,${im.data}` } })), { type: 'text', text: m.content }] }
        : { role: m.role, content: m.content }));
      const body = { model: p.model, messages: msgs, max_tokens: maxTokens };
      if (temperature !== undefined) body.temperature = temperature;
      const j = await post(`${trim(p.baseUrl) || 'https://api.openai.com/v1'}/chat/completions`, key ? { authorization: `Bearer ${key}` } : {}, body);
      return j.choices?.[0]?.message?.content || '';
    } finally {
      clearTimeout(timer);
    }
  }

  // ------------------------------------------------------------- export --
  function printHtml(html, title) {
    return new Promise((resolve) => {
      const fr = document.createElement('iframe');
      fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
      fr.srcdoc = html;
      fr.onload = () => {
        const oldTitle = document.title;
        document.title = title; // becomes the suggested PDF file name
        setTimeout(() => {
          try { fr.contentWindow.focus(); fr.contentWindow.print(); } finally {
            document.title = oldTitle;
            setTimeout(() => fr.remove(), 1000);
            resolve();
          }
        }, 150);
      };
      document.body.append(fr);
    });
  }

  // -------------------------------------------------------------- dirty --
  let dirty = false;
  window.addEventListener('beforeunload', (e) => {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  // =============================================================== API ====
  window.crucible = {
    platform: 'web',
    cssPaging: true,
    get storageMode() { return folderMode() ? 'folder' : 'browser'; },

    // ---------------------------------------------------------- books ----
    async openBook() {
      if (folderMode()) {
        const dir = await pickDir('crucible-book');
        if (dir === null) return null;
        if (dir) {
          const files = (await new FolderRoot(dir).list('')).filter((n) => TEXTS.includes(extOf(n))).sort();
          if (!files.length) { toast(`No .md file in "${dir.name}". Pick the folder that contains your manuscript.`, true, 6000); return null; }
          const file = files.length === 1 ? files[0] : await chooseFrom(`Which manuscript in "${dir.name}"?`, files);
          if (!file) return null;
          const key = `${dir.name}/${file}`;
          await rememberBook(key, new FolderRoot(dir), file);
          currentKey = key;
          forgetUrls('mem:');
          return loadAt(key);
        }
      }
      // Browser-storage mode: copy the chosen file into the browser.
      const [f] = await inputPick({ accept: '.md,.markdown,.txt' });
      if (!f) return null;
      const key = `Browser storage/${f.name}`;
      const root = new BrowserRoot(`${f.name}/`);
      if (!(await root.exists(f.name))) await root.write(f.name, await f.text());
      else if (await confirmModal('Already in browser storage', `"${f.name}" is already stored in this browser. Replace that copy with the file you just picked? (Change pool, memory and chat are kept either way.)`, 'Replace')) {
        await root.write(f.name, await f.text());
      }
      await rememberBook(key, root, f.name);
      currentKey = key;
      forgetUrls('mem:');
      return loadAt(key);
    },

    async openBookPath(key) {
      const rec = await DB.get('kv', 'book:' + key);
      if (!rec) throw new Error('Crucible no longer has access to that book — use Open.');
      if (rec.dir) {
        if (!(await ensurePerm(rec.dir, 'readwrite'))) throw new Error('Folder access was not allowed.');
        books.set(key, { root: new FolderRoot(rec.dir), file: rec.file });
      } else books.set(key, { root: new BrowserRoot(rec.browser), file: rec.file });
      await rememberBook(key, books.get(key).root, rec.file);
      currentKey = key;
      forgetUrls('mem:');
      return loadAt(key);
    },

    async saveBook({ bookPath, text, project }) {
      const { root, file } = bookOf(bookPath);
      const side = sidecarOf(file);
      const old = await root.read(file);
      if (old !== null && old !== text) {
        const stamp = new Date().toISOString().replace(/[:.]/g, '-');
        const base = file.replace(/\.[^.]+$/, '');
        await root.write(`${side}/backups/${base}_${stamp}.md`, old);
        const all = (await root.list(`${side}/backups`)).filter((f) => f.endsWith('.md')).sort();
        for (const o of all.slice(0, Math.max(0, all.length - MAX_BACKUPS))) await root.remove(`${side}/backups/${o}`);
      }
      await root.write(file, text);
      await root.write(`${side}/project.json`, JSON.stringify(project, null, 2));
      return { ok: true, savedAt: Date.now() };
    },

    async saveBookAs({ text, project, currentPath }) {
      let name = await promptModal('Save manuscript as', 'File name', currentPath ? currentPath.split('/').pop() : 'Untitled.md');
      if (!name) return null;
      name = name.replace(/[\\/:*?"<>|]+/g, '').trim();
      if (!/\.(md|markdown|txt)$/i.test(name)) name += '.md';
      let root, key;
      if (folderMode()) {
        const dir = await pickDir('crucible-book');
        if (dir === null) return null;
        if (dir) { root = new FolderRoot(dir); key = `${dir.name}/${name}`; }
      }
      if (!root) { root = new BrowserRoot(`${name}/`); key = `Browser storage/${name}`; }
      if (await root.exists(name) && !(await confirmModal('Replace file?', `"${name}" already exists there. Replace it?`, 'Replace'))) return null;
      // Carry story memory across to the new location.
      if (currentPath && books.has(currentPath)) {
        const from = bookOf(currentPath);
        const memDir = `${sidecarOf(from.file)}/memory`;
        for (const f of await from.root.list(memDir)) {
          await root.write(`${sidecarOf(name)}/memory/${f}`, await from.root.read(`${memDir}/${f}`, true));
        }
      }
      books.set(key, { root, file: name });
      const r = await this.saveBook({ bookPath: key, text, project });
      await rememberBook(key, root, name);
      currentKey = key;
      forgetUrls('mem:');
      return { ...r, path: key, sidecar: sidecarOf(name) };
    },

    async listBackups(bookPath) {
      const { root, file } = bookOf(bookPath);
      return (await root.list(`${sidecarOf(file)}/backups`)).filter((f) => f.endsWith('.md')).sort().reverse();
    },
    async readBackup({ bookPath, name }) {
      const { root, file } = bookOf(bookPath);
      return (await root.read(`${sidecarOf(file)}/backups/${name}`)) || '';
    },

    // Download the manuscript (main way out of browser-storage mode).
    downloadText(name, text) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown' }));
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    },

    // --------------------------------------------------------- memory ----
    async addMemory(bookPath) {
      const { root, file } = bookOf(bookPath);
      const picked = await pickFiles('application/octet-stream', [...IMAGES, ...TEXTS], true);
      const items = [];
      for (const p of picked) {
        const ext = extOf(p.name);
        const kind = IMAGES.includes(ext) ? 'image' : TEXTS.includes(ext) ? 'text' : null;
        if (!kind) continue;
        const id = idOf();
        const stored = `${id}_${p.name}`;
        await root.write(`${sidecarOf(file)}/memory/${stored}`, p.file);
        items.push({ id, kind, name: p.name, file: stored, notes: '', tags: '', includeInAI: true, sendImage: false, added: Date.now() });
        // The copy now lives with the book; drop the temporary pick.
        if (p.path.startsWith('h:')) await DB.del('kv', 'handle:' + p.path.slice(2));
        if (p.path.startsWith('sess:')) sessionBlobs.delete(p.path);
      }
      return items;
    },
    async newMemoryNote({ bookPath, name }) {
      const { root, file } = bookOf(bookPath);
      const id = idOf();
      const safe = (name || 'note').replace(/[^\w\- ]+/g, '').trim() || 'note';
      const stored = `${id}_${safe}.md`;
      await root.write(`${sidecarOf(file)}/memory/${stored}`, `# ${name || 'Note'}\n\n`);
      return { id, kind: 'text', name: `${safe}.md`, file: stored, notes: '', tags: '', includeInAI: true, sendImage: false, added: Date.now() };
    },
    async readMemoryText({ bookPath, file: f }) {
      const { root, file } = bookOf(bookPath);
      return (await root.read(`${sidecarOf(file)}/memory/${f}`)) || '';
    },
    async writeMemoryText({ bookPath, file: f, text }) {
      const { root, file } = bookOf(bookPath);
      await root.write(`${sidecarOf(file)}/memory/${f}`, text);
    },
    memoryPath: async ({ file }) => 'mem:' + file,
    async deleteMemory({ bookPath, file: f }) {
      const { root, file } = bookOf(bookPath);
      await root.remove(`${sidecarOf(file)}/memory/${f}`);
      forgetUrls('mem:' + f);
    },

    // ---------------------------------------------------- music & files ----
    pickSongs: () => pickFiles('audio/*', AUDIO, true).then((a) => a.map(({ path, name }) => ({ path, name }))),
    async pickMusicFolder() {
      if (!folderMode()) {
        toast('This browser can\'t open folders — pick the songs instead (they\'ll play this session).', true, 5000);
        return this.pickSongs();
      }
      let dir;
      try { dir = await window.showDirectoryPicker({ id: 'crucible-music', mode: 'read' }); } catch { return []; }
      const dirId = idOf();
      await DB.set('kv', 'dir:' + dirId, { handle: dir });
      const out = [];
      const walk = async (d, rel, depth) => {
        if (depth > 4) return;
        for await (const [name, h] of d.entries()) {
          if (h.kind === 'directory') await walk(h, [...rel, name], depth + 1);
          else if (AUDIO.includes(extOf(name))) out.push({ path: `df:${dirId}/${[...rel, name].map(encodeURIComponent).join('/')}`, name: name.replace(/\.[^.]+$/, '') });
        }
      };
      await walk(dir, [], 0);
      return out.sort((a, b) => a.path.localeCompare(b.path));
    },
    pickImage: () => pickFiles('image/*', IMAGES, false).then((a) => (a[0] ? { path: a[0].path, name: a[0].name } : null)),
    fileExists: exists,
    urlFor,
    reveal: () => toast('Browsers can\'t open folders in Explorer — the file is in the folder you chose.'),

    // ----------------------------------------------------------- misc ----
    getSettings: async () => publicSettings(await loadSettings()),
    saveSettings,
    aiChat: async (args) => {
      try { return { ok: true, text: await callAI(args) }; } catch (e) { return { ok: false, error: e.message }; }
    },
    async exportPdf({ html, suggestedName }) {
      await printHtml(html, (suggestedName || 'book.pdf').replace(/\.pdf$/i, ''));
      return { ok: true, printed: true };
    },
    replaceMisspelling: async () => {},
    onSpelling: () => {},
    setDirty: (d) => { dirty = !!d; },
    setTitle: (t) => { document.title = t; },
    onSaveAndQuit: () => {},
    quitNow: () => {},
  };
})();

  <script>/* js/state.js */
// =============================================================================
// state.js — the single place where the app's live data lives
// -----------------------------------------------------------------------------
// S.path      full path of the open .md file (null for an unsaved book)
// S.project   everything stored in <book>.crucible/project.json:
//               pool[]    passages you flagged for change
//               links[]   songs/pictures tied to passages (paths only)
//               memory[]  photos + fact files the AI reads
//               chat[]    the AI desk conversation
//               meta{}    title, author, export options, etc.
// S.settings  global app settings (AI providers, playlist, theme)
// The manuscript text itself is the editor's value: editor.value.
// =============================================================================

const S = {
  path: null,
  sidecar: null,
  project: null,
  settings: null,
  dirty: false,
  lastSaved: null,
};

function blankProject() {
  return { version: 1, pool: [], links: [], memory: [], chat: [], meta: { negotiate: [] } };
}

// Tiny event bus so modules can react to each other without tangling.
const Bus = {
  handlers: {},
  on(evt, fn) { (this.handlers[evt] ||= []).push(fn); },
  emit(evt, data) { (this.handlers[evt] || []).forEach((fn) => fn(data)); },
};

function markDirty(on = true) {
  if (S.dirty === on) return;
  S.dirty = on;
  window.crucible.setDirty(on);
  updateTitle();
}

function updateTitle() {
  const name = S.path ? baseName(S.path) : 'Untitled';
  window.crucible.setTitle(`${S.dirty ? '• ' : ''}${name} — Crucible`);
  $('#stFile').textContent = S.path || 'Unsaved manuscript';
  $('#stDirty').textContent = S.dirty ? 'unsaved changes' : (S.lastSaved ? `saved ${new Date(S.lastSaved).toLocaleTimeString()}` : '');
}

async function persistSettings(partial) {
  S.settings = await window.crucible.saveSettings(partial);
  Bus.emit('settings', S.settings);
}

  <script>/* js/editor.js */
// =============================================================================
// editor.js — the manuscript editor
// -----------------------------------------------------------------------------
// The editor is a plain <textarea>. That's deliberate: it handles a 150,000-word
// file smoothly, keeps exact character positions (which the change pool and
// links rely on), and gives native spell-check and Ctrl+Z undo for free.
//
// Every programmatic change (AI revision, replace, restore) goes through
// Editor.replaceRange(), which uses the browser's insertText command so it
// lands on the normal undo stack — Ctrl+Z undoes an AI change like any typing.
// =============================================================================

const Editor = {
  ta: null,
  lastText: '',
  outline: [],
  spell: { word: '', suggestions: [] },

  init() {
    this.ta = $('#editor');
    this.ta.addEventListener('input', () => this.onInput());
    this.ta.addEventListener('keyup', () => this.onCaret());
    this.ta.addEventListener('mouseup', () => this.onCaret());
    this.ta.addEventListener('scroll', debounce(() => this.syncPreviewScroll(), 30));
    this.ta.addEventListener('contextmenu', (e) => this.showContextMenu(e));
    this.ta.addEventListener('keydown', (e) => this.onKeyDown(e));
    document.addEventListener('mousedown', (e) => {
      if (!$('#ctxMenu').contains(e.target)) $('#ctxMenu').classList.add('hidden');
    });
    window.crucible.onSpelling((d) => {
      this.spell = d;
      if (!$('#ctxMenu').classList.contains('hidden') && d.word) this.renderContextMenu(this._ctxPos);
    });
    $$('#viewSeg button').forEach((b) => b.addEventListener('click', () => this.setView(b.dataset.view)));
    this.initFind();
  },

  get text() { return this.ta.value; },

  // Load a whole new manuscript (clears undo history; that's expected on open).
  setText(t) {
    this.ta.value = t;
    this.lastText = t;
    this.ta.setSelectionRange(0, 0);
    this.ta.scrollTop = 0;
    this.refreshAll();
  },

  // ---------------------------------------------------------------- input --
  onInput() {
    const now = this.ta.value;
    if (now === this.lastText) return;
    if (this.bulk) {
      // Whole-document changes (replace all, restore backup) are re-anchored
      // by searching for each passage's text afterwards instead.
      this.bulk = false;
    } else {
      const ch = TextOps.changedRegion(this.lastText, now);
      // Keep every stored passage pointing at the same words after the edit.
      Bus.emit('textChange', { change: ch, text: now });
    }
    this.lastText = now;
    markDirty(true);
    this.refreshSoon();
  },

  refreshSoon: debounce(function () { Editor.refreshAll(); }, 350),

  refreshAll() {
    this.outline = TextOps.outline(this.ta.value);
    this.renderOutline();
    $('#stWords').textContent = `${countWords(this.ta.value).toLocaleString()} words`;
    if ($('#editorWrap').dataset.view !== 'edit') this.renderPreview();
    this.onCaret();
  },

  onCaret() {
    const { selectionStart: a, selectionEnd: b } = this.ta;
    $('#stSel').textContent = b > a ? `${countWords(this.ta.value.slice(a, b))} selected` : '';
    const cur = this.chapterAt(a);
    $('#stChapter').textContent = cur ? cur.title : '';
    $$('#outline .ol-item').forEach((n) => n.classList.toggle('cur', cur && +n.dataset.offset === cur.offset));
    Bus.emit('caret', a);
  },

  onKeyDown(e) {
    // Ctrl+Shift+A: add selection to the change pool
    if ((e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') || (e.altKey && !e.ctrlKey && e.key.toLowerCase() === 'a')) {
      e.preventDefault();
      Pool.addFromSelection();
    }
  },

  // ------------------------------------------------------------- geometry --
  chapterAt(pos) {
    let cur = null;
    for (const h of this.outline) { if (h.offset <= pos) cur = h; else break; }
    return cur;
  },

  // Textareas can't tell you the pixel height of a character offset, so we
  // measure it with an invisible copy of the editor ("mirror") holding the
  // text up to that point.
  offsetTop(pos) {
    const cs = getComputedStyle(this.ta);
    let m = this._mirror;
    if (!m) {
      m = this._mirror = document.createElement('div');
      Object.assign(m.style, { position: 'absolute', visibility: 'hidden', top: '0', left: '-9999px', whiteSpace: 'pre-wrap', wordWrap: 'break-word', overflowWrap: 'break-word' });
      document.body.append(m);
    }
    for (const p of ['fontFamily', 'fontSize', 'lineHeight', 'paddingLeft', 'paddingRight', 'paddingTop', 'letterSpacing', 'tabSize', 'boxSizing']) m.style[p] = cs[p];
    m.style.width = this.ta.clientWidth + 'px';
    m.textContent = this.ta.value.slice(0, pos) + '​';
    return m.scrollHeight;
  },

  // Select a range and scroll it to about a third of the way down the screen.
  reveal(start, end = start, focus = true) {
    if ($('#editorWrap').dataset.view === 'preview') this.setView('split');
    if (focus) this.ta.focus();
    this.ta.setSelectionRange(start, end);
    const y = this.offsetTop(start);
    this.ta.scrollTop = Math.max(0, y - this.ta.clientHeight / 3);
    this.onCaret();
  },

  // Undo-friendly replacement of [start,end) with new text.
  replaceRange(start, end, text) {
    this.ta.focus();
    this.ta.setSelectionRange(start, end);
    const ok = document.execCommand('insertText', false, text);
    if (!ok) {
      // Fallback (no undo) if the command is unavailable.
      this.ta.setRangeText(text, start, end, 'end');
      this.onInput();
    }
  },

  // Replace the whole manuscript but keep it undoable.
  // transform(passageText) tells linked passages how their own text changed.
  replaceAll(text, transform = (t) => t) {
    this.bulk = true;
    this.replaceRange(0, this.ta.value.length, text);
    this.bulk = false;
    this.ta.setSelectionRange(0, 0);
    Bus.emit('relocate', { text: this.ta.value, transform });
  },

  selection() {
    const { selectionStart: start, selectionEnd: end } = this.ta;
    return { start, end, text: this.ta.value.slice(start, end) };
  },

  // ---------------------------------------------------------------- views --
  setView(v) {
    $('#editorWrap').dataset.view = v;
    $$('#viewSeg button').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
    if (v !== 'edit') this.renderPreview();
    if (S.settings && S.settings.ui.view !== v) persistSettings({ ui: { ...S.settings.ui, view: v } });
  },

  renderPreview() {
    const html = marked.parse(this.ta.value.replace(/<!--[\s\S]*?-->/g, ''));
    $('#preview').innerHTML = sanitizeHtml(html);
  },

  syncPreviewScroll() {
    if ($('#editorWrap').dataset.view !== 'split') return;
    const ta = this.ta, pv = $('#previewPane');
    const ratio = ta.scrollTop / Math.max(1, ta.scrollHeight - ta.clientHeight);
    pv.scrollTop = ratio * (pv.scrollHeight - pv.clientHeight);
  },

  renderOutline() {
    const box = $('#outline');
    box.innerHTML = '';
    if (!this.outline.length) {
      box.append(el('div', { class: 'empty' }, 'Chapters appear here from your Markdown headings (# Chapter One, ## Scene…).'));
      return;
    }
    for (const h of this.outline) {
      box.append(el('div', {
        class: `ol-item ol-${h.level}`,
        'data-offset': h.offset,
        title: h.title,
        onclick: () => this.reveal(h.offset),
      }, el('span', { class: 'wc' }, h.words.toLocaleString()), h.title));
    }
  },

  // --------------------------------------------------------- context menu --
  showContextMenu(e) {
    if (e.shiftKey) return; // Shift+right-click: let the browser show its own menu (spelling suggestions)
    e.preventDefault();
    this.spell = { word: '', suggestions: [] }; // fresh; main process will fill it in
    this._ctxPos = { x: e.clientX, y: e.clientY };
    this.renderContextMenu(this._ctxPos);
  },

  renderContextMenu({ x, y }) {
    const menu = $('#ctxMenu');
    const sel = this.selection();
    const has = sel.end > sel.start;
    const item = (label, fn, opts = {}) => el('div', {
      class: `mi ${opts.hot ? 'hot' : ''} ${opts.disabled ? 'disabled' : ''}`,
      onmousedown: (ev) => { ev.preventDefault(); menu.classList.add('hidden'); fn(); },
    }, label, opts.key ? el('span', { class: 'k' }, opts.key) : null);
    const sep = () => el('div', { class: 'sep' });

    menu.innerHTML = '';
    if (this.spell.word) {
      const sugg = this.spell.suggestions.slice(0, 5);
      if (sugg.length) sugg.forEach((w) => menu.append(item(w, () => window.crucible.replaceMisspelling(w), { hot: true })));
      else menu.append(item('No spelling suggestions', () => {}, { disabled: true }));
      menu.append(sep());
    }
    menu.append(
      item('✚  Add to change pool', () => Pool.addFromSelection(), { hot: true, disabled: !has, key: window.crucible.platform === 'web' ? 'Alt+A' : 'Ctrl+Shift+A' }),
      item('✎  Add to pool with a note…', () => Pool.addFromSelection(true), { disabled: !has }),
      item('⚒  Negotiate this with AI now', () => Pool.addFromSelection(false, true), { disabled: !has }),
      sep(),
      item(`♪  Link a song${has ? '' : ' to this paragraph'}…`, () => Links.startLink('song')),
      item(`▣  Link a picture${has ? '' : ' to this paragraph'}…`, () => Links.startLink('image')),
      window.crucible.platform === 'web' ? el('div', { class: 'mi disabled', style: 'font-size:11px' }, 'Shift+right-click for spelling suggestions') : null,
      sep(),
      item('Cut', () => document.execCommand('cut'), { disabled: !has, key: 'Ctrl+X' }),
      item('Copy', () => document.execCommand('copy'), { disabled: !has, key: 'Ctrl+C' }),
      item('Paste', async () => {
        const t = await navigator.clipboard.readText().catch(() => '');
        if (t) { const s = this.selection(); this.replaceRange(s.start, s.end, t); }
      }, { key: 'Ctrl+V' }),
    );
    menu.classList.remove('hidden');
    const r = menu.getBoundingClientRect();
    menu.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
    menu.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
  },

  // --------------------------------------------------------- find/replace --
  initFind() {
    const bar = $('#findBar'), fi = $('#findInput'), ri = $('#replaceInput');
    const re = () => {
      const q = fi.value;
      if (!q) return null;
      return new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), $('#findCase').checked ? 'g' : 'gi');
    };
    const count = () => {
      const r = re();
      $('#findCount').textContent = r ? `${(this.ta.value.match(r) || []).length} found` : '';
    };
    const go = (dir) => {
      const r = re(); if (!r) return;
      const t = this.ta.value;
      const matches = [...t.matchAll(r)].map((m) => m.index);
      if (!matches.length) return toast('Not found');
      const pos = dir > 0 ? this.ta.selectionEnd : this.ta.selectionStart;
      let idx = dir > 0 ? matches.find((i) => i >= pos) : [...matches].reverse().find((i) => i < pos);
      if (idx === undefined) idx = dir > 0 ? matches[0] : matches[matches.length - 1];
      this.reveal(idx, idx + fi.value.length, false);
      fi.focus();
    };
    this.openFind = () => {
      bar.classList.remove('hidden');
      const s = this.selection();
      if (s.text && s.text.length < 80 && !s.text.includes('\n')) fi.value = s.text;
      fi.focus(); fi.select(); count();
    };
    fi.addEventListener('input', count);
    $('#findCase').addEventListener('change', count);
    fi.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(e.shiftKey ? -1 : 1); if (e.key === 'Escape') bar.classList.add('hidden'); });
    $('#findNext').onclick = () => go(1);
    $('#findPrev').onclick = () => go(-1);
    $('#findClose').onclick = () => bar.classList.add('hidden');
    $('#replaceOne').onclick = () => {
      const s = this.selection(), r = re();
      if (r && s.text && s.text.match(new RegExp(`^${r.source}$`, r.flags.replace('g', '')))) {
        this.replaceRange(s.start, s.end, ri.value);
      }
      go(1); count();
    };
    $('#replaceAll').onclick = async () => {
      const r = re(); if (!r) return;
      const n = (this.ta.value.match(r) || []).length;
      if (!n) return toast('Nothing to replace');
      if (!(await confirmModal('Replace all', `Replace ${n} occurrence(s)? You can undo with Ctrl+Z.`, 'Replace all'))) return;
      this.replaceAll(this.ta.value.replace(r, () => ri.value), (t) => t.replace(r, () => ri.value));
      count();
      toast(`Replaced ${n}`);
    };
  },
};
