  <script>/* js/pool.js */
// =============================================================================
// pool.js — the change pool
// -----------------------------------------------------------------------------
// Each pool item remembers:
//   text     the exact passage you highlighted (kept current as you edit it)
//   start/end its character position in the manuscript (auto-adjusted on every edit)
//   note     what you want changed (optional)
//   status   pending → negotiating → applied   (or dismissed / missing)
//   history  every version this passage has had, so you can see what changed
// =============================================================================

// Shared by the pool and links: keep stored ranges glued to their words.
function trackAnchors(getList, onChanged) {
  Bus.on('textChange', ({ change, text }) => {
    let touched = false;
    for (const it of getList()) {
      if (it.status === 'dismissed') continue;
      const before = it.start + ':' + it.end;
      const r = TextOps.shiftRange(it, change);
      it.start = Math.max(0, r.start);
      it.end = Math.min(text.length, Math.max(it.start, r.end));
      if (before !== it.start + ':' + it.end) {
        // If the edit landed inside the passage, refresh its stored text.
        if (change.start < it.end && change.newEnd > it.start || (change.start >= it.start && change.start <= it.end)) {
          it.text = text.slice(it.start, it.end);
        }
        touched = true;
      }
    }
    if (touched) onChanged();
  });
  Bus.on('relocate', ({ text, transform }) => {
    for (const it of getList()) {
      let pos = TextOps.locate(text, it);
      if (pos === null) {
        const t2 = transform(it.text);
        pos = TextOps.locate(text, { ...it, text: t2 });
        if (pos !== null) it.text = t2;
      }
      if (pos === null) { if (it.status !== 'dismissed' && it.status !== 'applied') it.missing = true; }
      else { it.start = pos; it.end = pos + it.text.length; it.missing = false; }
    }
    onChanged();
  });
}

const Pool = {
  init() {
    trackAnchors(() => S.project.pool, debounce(() => this.render(), 400));
    $('#poolFilter').addEventListener('change', () => this.render());
    $('#btnNegotiateSel').addEventListener('click', () => {
      const ids = $$('#poolList input[type=checkbox]:checked').map((c) => c.dataset.id);
      if (!ids.length) return toast('Tick one or more items first');
      this.negotiate(ids);
    });
  },

  items() { return S.project.pool; },
  get(id) { return S.project.pool.find((p) => p.id === id); },

  async addFromSelection(withNote = false, negotiateNow = false) {
    const s = Editor.selection();
    if (!s.text.trim()) return toast('Highlight some text first');
    let note = '';
    if (withNote) {
      note = await promptModal('What should change?', snippet(s.text, 220), '', true);
      if (note === null) return;
    }
    const chapter = Editor.chapterAt(s.start);
    const item = {
      id: uid(),
      text: s.text,
      start: s.start,
      end: s.end,
      note,
      status: 'pending',
      chapter: chapter ? chapter.title : '',
      created: Date.now(),
      history: [],
    };
    S.project.pool.unshift(item);
    markDirty(true);
    this.render();
    if (negotiateNow) this.negotiate([item.id]);
    else toast('Added to change pool');
  },

  // Return the item's current position, re-finding it if needed.
  resolve(item) {
    const pos = TextOps.locate(Editor.text, item);
    if (pos === null) { item.missing = true; return null; }
    item.missing = false;
    item.start = pos;
    item.end = pos + item.text.length;
    return pos;
  },

  goTo(item) {
    if (this.resolve(item) === null) return toast("Can't find that passage any more — it may have been rewritten.", true);
    Editor.reveal(item.start, item.end);
  },

  negotiate(ids) {
    S.project.meta.negotiate = ids;
    for (const id of ids) {
      const it = this.get(id);
      if (it && it.status === 'pending') it.status = 'negotiating';
    }
    markDirty(true);
    this.render();
    AI.showTab();
    AI.renderContext();
    const first = this.get(ids[0]);
    const input = $('#chatInput');
    if (first && first.note && !input.value) input.value = first.note;
    input.focus();
  },

  // Called when you press "Apply" on an AI revision.
  apply(id, newText) {
    const item = this.get(id);
    if (!item) return toast('That pool item no longer exists', true);
    if (this.resolve(item) === null) return toast("Can't find the original passage — was it edited by hand? Use Copy instead.", true);
    const old = item.text;
    const start = item.start;
    Editor.replaceRange(item.start, item.end, newText);
    // replaceRange triggered anchor shifting; pin this item to its new text exactly.
    item.history = item.history || [];
    item.history.push({ text: old, at: Date.now() });
    item.text = newText;
    item.start = start;
    item.end = start + newText.length;
    item.status = 'applied';
    item.missing = false;
    markDirty(true);
    this.render();
    AI.renderContext();
    Editor.reveal(item.start, item.end);
    toast('Change applied — Ctrl+Z in the manuscript undoes it');
  },

  setStatus(item, st) {
    item.status = st;
    if (st !== 'negotiating') {
      S.project.meta.negotiate = (S.project.meta.negotiate || []).filter((x) => x !== item.id);
      AI.renderContext();
    }
    markDirty(true);
    this.render();
  },

  async editNote(item) {
    const n = await promptModal('Change note', snippet(item.text, 220), item.note || '', true);
    if (n === null) return;
    item.note = n;
    markDirty(true);
    this.render();
  },

  remove(item) {
    S.project.pool = S.project.pool.filter((p) => p !== item);
    S.project.meta.negotiate = (S.project.meta.negotiate || []).filter((x) => x !== item.id);
    markDirty(true);
    this.render();
    AI.renderContext();
  },

  showHistory(item) {
    const body = el('div', {},
      ...(item.history || []).map((h, i) => el('div', { class: 'card' },
        el('div', { class: 'tag' }, `Version ${i + 1} · ${new Date(h.at).toLocaleString()}`),
        el('div', { style: 'font-family:var(--serif);white-space:pre-wrap;margin-top:4px' }, h.text))),
      el('div', { class: 'card applied' }, el('div', { class: 'tag st-applied' }, 'Current'),
        el('div', { style: 'font-family:var(--serif);white-space:pre-wrap;margin-top:4px' }, item.text)));
    openModal({ title: 'Passage history', body, wide: true });
  },

  render() {
    const filter = $('#poolFilter').value;
    const list = $('#poolList');
    const open = S.project.pool.filter((p) => p.status === 'pending' || p.status === 'negotiating');
    $('#poolBadge').textContent = open.length;
    const shown = S.project.pool.filter((p) =>
      filter === 'all' ? true : filter === 'open' ? (p.status === 'pending' || p.status === 'negotiating') : p.status === filter);
    list.innerHTML = '';
    if (!shown.length) {
      list.append(el('div', { class: 'empty' },
        filter === 'open'
          ? 'Highlight text in your manuscript, right-click, and choose "Add to change pool". Everything you want to rework collects here.'
          : 'Nothing here.'));
      return;
    }
    const negotiating = new Set(S.project.meta.negotiate || []);
    for (const it of shown) {
      const st = it.missing && it.status !== 'applied' ? 'missing' : it.status;
      const card = el('div', { class: `card ${st}` },
        el('div', { class: 'row' },
          (it.status === 'pending' || it.status === 'negotiating')
            ? el('input', { type: 'checkbox', 'data-id': it.id, checked: negotiating.has(it.id), title: 'Include in the next negotiation' })
            : null,
          el('span', { class: `tag st-${st}` }, st),
          el('span', { class: 'spacer' }),
          el('span', { class: 'tag', title: it.chapter }, snippet(it.chapter, 26))),
        el('div', { class: 'snippet', title: 'Show in manuscript', onclick: () => this.goTo(it) }, it.text),
        it.note ? el('div', { class: 'note' }, it.note) : null,
        el('div', { class: 'actions' },
          (it.status === 'pending' || it.status === 'negotiating')
            ? el('button', { class: 'small accent', onclick: () => this.negotiate([it.id]) }, 'Negotiate')
            : null,
          el('button', { class: 'small', onclick: () => this.editNote(it) }, it.note ? 'Edit note' : 'Add note'),
          it.history?.length ? el('button', { class: 'small', onclick: () => this.showHistory(it) }, `History (${it.history.length})`) : null,
          it.status === 'applied' || it.status === 'dismissed'
            ? el('button', { class: 'small', onclick: () => this.setStatus(it, 'pending') }, 'Reopen')
            : el('button', { class: 'small ghost', onclick: () => this.setStatus(it, 'dismissed') }, 'Dismiss'),
          el('button', { class: 'small ghost danger', title: 'Delete from pool', onclick: () => this.remove(it) }, '✕')));
      list.append(card);
    }
  },
};

  <script>/* js/memory.js */
// =============================================================================
// memory.js — story memory (the AI's reference shelf)
// -----------------------------------------------------------------------------
// Files you add are COPIED into <book>.crucible/memory/ so the memory travels
// with the book. Each item has:
//   includeInAI  text files: send the file's contents to the AI as background
//   sendImage    pictures: attach the actual image (only works with vision models)
//   notes/tags   your description — always sent, so the AI knows what a photo
//                shows even when the image itself isn't attached
// =============================================================================

const Memory = {
  cache: {}, // file -> text contents
  dirs: {},

  init() {
    $('#btnAddMemory').addEventListener('click', () => this.add());
    $('#btnNewNote').addEventListener('click', () => this.newNote());
    $('#memSearch').addEventListener('input', debounce(() => this.render(), 150));
  },

  items() { return S.project.memory; },
  images() { return S.project.memory.filter((m) => m.kind === 'image'); },

  async requireSaved() {
    if (S.path) return true;
    const ok = await confirmModal('Save the book first',
      'Story memory is stored in a folder next to your manuscript, so the book needs a file name first.', 'Save as…');
    if (ok) await App.saveAs();
    return !!S.path;
  },

  async add() {
    if (!(await this.requireSaved())) return;
    const items = await window.crucible.addMemory(S.path);
    if (!items.length) return;
    S.project.memory.push(...items);
    markDirty(true);
    await this.render();
    toast(`Added ${items.length} item(s) to story memory`);
  },

  async newNote() {
    if (!(await this.requireSaved())) return;
    const name = await promptModal('New memory note', 'e.g. "Oakvale geography", "Character bible – Judy"');
    if (!name) return;
    const item = await window.crucible.newMemoryNote({ bookPath: S.path, name });
    S.project.memory.push(item);
    markDirty(true);
    await this.render();
    this.editText(item);
  },

  async pathOf(item) {
    return window.crucible.memoryPath({ bookPath: S.path, file: item.file });
  },

  async textOf(item) {
    if (this.cache[item.file] === undefined) {
      this.cache[item.file] = await window.crucible.readMemoryText({ bookPath: S.path, file: item.file });
    }
    return this.cache[item.file];
  },

  async editText(item) {
    const ta = el('textarea', { style: 'width:100%;height:58vh;font:14px/1.6 var(--serif)' });
    ta.value = await this.textOf(item);
    openModal({
      title: `Edit ${item.name}`,
      body: ta,
      wide: true,
      buttons: [
        { label: 'Cancel' },
        {
          label: 'Save note', accent: true,
          onClick: async () => {
            await window.crucible.writeMemoryText({ bookPath: S.path, file: item.file, text: ta.value });
            this.cache[item.file] = ta.value;
            this.render();
            toast('Memory note saved');
          },
        },
      ],
    });
  },

  async view(item) {
    let src;
    try { src = await mediaUrl(await this.pathOf(item)); } catch (e) { return toast(e.message, true); }
    openModal({
      cls: 'lightbox',
      body: el('div', {}, el('img', { src }),
        el('div', { class: 'cap' }, item.notes || item.name)),
      buttons: [],
    });
  },

  async remove(item) {
    if (!(await confirmModal('Remove from memory', `Delete "${item.name}" from story memory? The copy inside the book folder will be removed (your original file is untouched).`, 'Remove'))) return;
    await window.crucible.deleteMemory({ bookPath: S.path, file: item.file });
    S.project.memory = S.project.memory.filter((m) => m !== item);
    markDirty(true);
    this.render();
  },

  // Assemble the memory text block sent to the AI, within a size budget.
  async buildContext(budgetChars = 120000) {
    let used = 0, truncated = false;
    const parts = [];
    for (const m of S.project.memory.filter((x) => x.kind === 'text' && x.includeInAI)) {
      let t = await this.textOf(m);
      const head = `### ${m.name}${m.tags ? ` [${m.tags}]` : ''}${m.notes ? `\n(${m.notes})` : ''}\n`;
      if (used + t.length + head.length > budgetChars) {
        t = t.slice(0, Math.max(0, budgetChars - used - head.length));
        truncated = true;
      }
      parts.push(head + t);
      used += head.length + t.length;
      if (used >= budgetChars) break;
    }
    const imgs = this.images();
    const imageLines = imgs.map((m) =>
      `- ${m.name}${m.tags ? ` [${m.tags}]` : ''}: ${m.notes || '(no description)'}${m.sendImage ? ' — image attached' : ''}`);
    return {
      text: parts.join('\n\n'),
      images: imageLines.join('\n'),
      imageFiles: imgs.filter((m) => m.sendImage).map((m) => m.file),
      truncated,
    };
  },

  async render() {
    const list = $('#memList');
    const q = $('#memSearch').value.trim().toLowerCase();
    $('#memBadge').textContent = S.project.memory.length;
    list.innerHTML = '';
    if (!S.project.memory.length) {
      list.append(el('div', { class: 'empty' },
        'Add photos, maps, character bibles, timelines, research notes — anything the AI should know about your story. ',
        el('br'), el('br'),
        'Text files (.md/.txt) are read in full. Photos get your written description, and can optionally be shown to vision-capable AIs.'));
      return;
    }
    const shown = S.project.memory.filter((m) => !q || `${m.name} ${m.tags} ${m.notes}`.toLowerCase().includes(q));
    for (const m of shown) {
      const notes = el('textarea', { rows: 2, placeholder: m.kind === 'image' ? 'What does this picture show? (the AI reads this)' : 'Short description (optional)' });
      notes.value = m.notes || '';
      notes.addEventListener('change', () => { m.notes = notes.value; markDirty(true); });
      const tags = el('input', { class: 'tags', placeholder: 'tags: character, place, 1952…', value: m.tags || '' });
      tags.addEventListener('change', () => { m.tags = tags.value; markDirty(true); });

      const card = el('div', { class: 'card' },
        el('div', { class: 'row' },
          el('span', { class: 'tag' }, m.kind === 'image' ? 'photo' : 'note'),
          el('span', { class: 'name', title: m.name }, m.name)));

      if (m.kind === 'image') {
        const img = el('img', { class: 'mem-thumb', onclick: () => this.view(m) });
        this.pathOf(m).then(mediaUrl).then((u) => (img.src = u)).catch(() => {});
        card.append(img);
      } else {
        const preview = el('div', { class: 'snippet muted', onclick: () => this.editText(m) }, '…');
        this.textOf(m).then((t) => (preview.textContent = snippet(t.replace(/^#.*$/m, ''), 200) || '(empty)'));
        card.append(preview);
      }
      card.append(notes, tags);

      const opt = m.kind === 'image'
        ? el('label', { class: 'check', title: 'Attach this image when talking to vision-capable AIs' },
          el('input', { type: 'checkbox', checked: m.sendImage, onchange: (e) => { m.sendImage = e.target.checked; markDirty(true); } }), 'Show image to AI')
        : el('label', { class: 'check' },
          el('input', { type: 'checkbox', checked: m.includeInAI, onchange: (e) => { m.includeInAI = e.target.checked; markDirty(true); } }), 'AI reads this');

      card.append(el('div', { class: 'actions' }, opt, el('span', { class: 'spacer' }),
        m.kind === 'text' ? el('button', { class: 'small', onclick: () => this.editText(m) }, 'Edit') : null,
        el('button', { class: 'small ghost danger', onclick: () => this.remove(m) }, '✕')));
      list.append(card);
    }
  },
};

  <script>/* js/ai.js */
// =============================================================================
// ai.js — the AI desk (negotiation box)
// -----------------------------------------------------------------------------
// How a message is built:
//   SYSTEM  = editing-partner instructions + story memory (+ whole book if ticked)
//   USER    = your words + a fresh copy of every passage under negotiation,
//             with ~1,000 characters of surrounding text so the AI sees context
//
// The AI is told to wrap proposed wording in <revision id="...">…</revision>.
// Crucible turns each of those into a card with Apply / Diff / Copy buttons.
// Nothing touches your manuscript until you press Apply.
// =============================================================================

const AI = {
  busy: false,
  CONTEXT_CHARS: 1000,

  init() {
    $('#btnSend').addEventListener('click', () => this.send());
    $('#chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); this.send(); }
    });
    $('#btnNewChat').addEventListener('click', async () => {
      if (S.project.chat.length && !(await confirmModal('New chat', 'Clear this conversation? (Applied changes stay in your manuscript.)', 'Clear'))) return;
      S.project.chat = [];
      markDirty(true);
      this.renderChat();
    });
    $('#providerSelect').addEventListener('change', (e) => persistSettings({ activeProviderId: e.target.value }));
    Bus.on('settings', () => this.renderProviders());
  },

  showTab() { App.showTab('right', 'ai'); },

  renderProviders() {
    const sel = $('#providerSelect');
    sel.innerHTML = '';
    const ps = S.settings.providers;
    if (!ps.length) sel.append(el('option', { value: '' }, 'Add an AI in Settings ⚙'));
    for (const p of ps) sel.append(el('option', { value: p.id }, `${p.name} · ${p.model || '?'}`));
    sel.value = S.settings.activeProviderId || ps[0]?.id || '';
  },

  activeItems() {
    return (S.project.meta.negotiate || []).map((id) => Pool.get(id)).filter(Boolean);
  },

  renderContext() {
    const box = $('#aiContext');
    const items = this.activeItems();
    box.innerHTML = '';
    if (!items.length) return;
    box.append(el('div', { class: 'ctx-head' }, `On the table (${items.length})`, el('span', { class: 'spacer' }),
      el('button', {
        class: 'small ghost', onclick: () => { S.project.meta.negotiate = []; markDirty(true); this.renderContext(); Pool.render(); },
      }, 'Clear')));
    for (const it of items) {
      box.append(el('div', { class: 'ctx-item' },
        el('span', { class: 't', title: 'Show in manuscript', style: 'cursor:pointer', onclick: () => Pool.goTo(it) }, it.text),
        el('button', {
          title: 'Take off the table',
          onclick: () => {
            S.project.meta.negotiate = S.project.meta.negotiate.filter((x) => x !== it.id);
            markDirty(true); this.renderContext(); Pool.render();
          },
        }, '✕')));
    }
  },

  async buildSystem() {
    const parts = [
      `You are the editing partner for a novelist working on their manuscript in an app called Crucible.
Your job is to negotiate revisions with the author: propose wording, explain your reasoning briefly, and adapt to their feedback. Preserve the author's voice, tense, point of view, and Markdown formatting unless asked otherwise. Stay consistent with the story memory below.

HOW TO PROPOSE NEW WORDING
- Put the complete replacement for a passage inside <revision id="ITEM_ID"> ... </revision>, using the id shown with that passage.
- The text inside the tag must be a drop-in replacement for the ENTIRE passage: no quotation marks around it, no commentary inside it.
- You may offer alternatives by writing several revision tags with the same id.
- For wording that isn't tied to a passage on the table, use <revision id="new"> ... </revision>.
- Keep discussion outside the tags short and useful. If the author is only asking a question, just answer it.`,
    ];
    if ($('#optMemory').checked) {
      const mem = await Memory.buildContext();
      if (mem.text) parts.push(`STORY MEMORY (reference material from the author)\n\n${mem.text}`);
      if (mem.images) parts.push(`PICTURES IN STORY MEMORY\n${mem.images}`);
      if (mem.truncated) toast('Story memory was too large and was trimmed for this message', true);
      this._imageFiles = mem.imageFiles;
    } else this._imageFiles = [];
    if ($('#optFullBook').checked) {
      parts.push(`FULL MANUSCRIPT\n\n${Editor.text}`);
    } else {
      const ol = Editor.outline.map((h) => `${'  '.repeat(h.level - 1)}- ${h.title} (${h.words} words)`).join('\n');
      if (ol) parts.push(`MANUSCRIPT OUTLINE\n${ol}`);
    }
    return parts.join('\n\n---\n\n');
  },

  passagesBlock() {
    const items = this.activeItems();
    if (!items.length) return '';
    const t = Editor.text;
    const blocks = items.map((it) => {
      Pool.resolve(it);
      const before = t.slice(Math.max(0, it.start - this.CONTEXT_CHARS), it.start);
      const after = t.slice(it.end, it.end + this.CONTEXT_CHARS);
      return `<passage id="${it.id}"${it.chapter ? ` chapter="${it.chapter.replace(/"/g, "'")}"` : ''}>
${it.note ? `Author's note: ${it.note}\n` : ''}<context_before>…${before}</context_before>
<target>${it.text}</target>
<context_after>${after}…</context_after>
</passage>`;
    });
    return `\n\n[Passages on the table — rewrite only the <target> text]\n${blocks.join('\n\n')}`;
  },

  async send() {
    if (this.busy) return;
    const input = $('#chatInput');
    const text = input.value.trim();
    if (!text) return;
    if (!S.settings.providers.length) {
      toast('Add an AI provider in Settings first', true);
      return Settings.open();
    }
    input.value = '';
    S.project.chat.push({ role: 'user', content: text, items: [...(S.project.meta.negotiate || [])], at: Date.now() });
    markDirty(true);
    this.renderChat();
    this.busy = true;
    $('#btnSend').disabled = true;
    const thinking = el('div', { class: 'msg assistant thinking' }, el('div', { class: 'who' }, 'AI'), el('div', { class: 'body' }, 'Thinking'));
    $('#chatLog').append(thinking);
    thinking.scrollIntoView({ block: 'end' });

    try {
      const system = await this.buildSystem();
      // Send prior turns as-is; attach live passages to the newest message.
      const history = S.project.chat
        .filter((m) => m.role === 'user' || m.role === 'assistant')
        .slice(-30)
        .map((m) => ({ role: m.role, content: m.content }));
      while (history.length && history[0].role !== 'user') history.shift(); // APIs require a user turn first
      history[history.length - 1].content += this.passagesBlock();
      const res = await window.crucible.aiChat({
        providerId: $('#providerSelect').value || S.settings.activeProviderId,
        system,
        messages: history,
        bookPath: S.path,
        imageFiles: this._imageFiles,
      });
      if (res.ok) {
        const prov = S.settings.providers.find((p) => p.id === $('#providerSelect').value);
        S.project.chat.push({ role: 'assistant', content: res.text, at: Date.now(), by: prov ? prov.name : '', applied: [] });
      } else {
        S.project.chat.push({ role: 'error', content: res.error, at: Date.now() });
      }
    } catch (e) {
      S.project.chat.push({ role: 'error', content: e.message, at: Date.now() });
    } finally {
      this.busy = false;
      $('#btnSend').disabled = false;
      markDirty(true);
      this.renderChat();
    }
  },

  // Split AI text into prose and <revision> blocks.
  parse(text) {
    const out = [];
    const re = /<revision\s+id\s*=\s*["']?([\w-]+)["']?\s*>([\s\S]*?)<\/revision>/gi;
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) out.push({ type: 'prose', text: text.slice(last, m.index) });
      out.push({ type: 'revision', id: m[1], text: m[2].replace(/^\n+|\n+$/g, '') });
      last = re.lastIndex;
    }
    if (last < text.length) out.push({ type: 'prose', text: text.slice(last) });
    return out;
  },

  renderChat() {
    const log = $('#chatLog');
    log.innerHTML = '';
    if (!S.project.chat.length) {
      log.append(el('div', { class: 'empty' },
        'Put passages on the table from the Change pool (or right-click → "Negotiate this with AI now"), then tell the AI what you want: ',
        el('br'), el('br'),
        el('em', {}, '"Make this tenser — Wade shouldn\'t say outright that he knows."'),
        el('br'), el('br'),
        'Proposed rewrites show up as cards you can compare and apply.'));
      return;
    }
    S.project.chat.forEach((m, mi) => {
      if (m.role === 'user') {
        log.append(el('div', { class: 'msg user' }, el('div', { class: 'who' }, 'You'), el('div', { class: 'body' }, m.content)));
        return;
      }
      if (m.role === 'error') {
        log.append(el('div', { class: 'msg error' }, el('div', { class: 'who' }, 'Error'), el('div', { class: 'body' }, m.content)));
        return;
      }
      const body = el('div', { class: 'body' });
      this.parse(m.content).forEach((part, pi) => {
        if (part.type === 'prose') {
          if (part.text.trim()) body.append(el('div', { html: sanitizeHtml(marked.parse(part.text)) }));
        } else body.append(this.revisionCard(part, m, `${mi}:${pi}`));
      });
      log.append(el('div', { class: 'msg assistant' }, el('div', { class: 'who' }, m.by || 'AI'), body));
    });
    log.scrollTop = log.scrollHeight;
  },

  revisionCard(part, msg, key) {
    const item = Pool.get(part.id);
    const applied = (msg.applied || []).includes(key);
    const card = el('div', { class: `revision ${applied ? 'applied' : ''}` });
    const diffBox = el('div', { class: 'rv-diff hidden' });
    const label = item ? `Rewrite · ${snippet(item.text, 40)}` : part.id === 'new' ? 'Suggested wording' : 'Rewrite (passage not in pool)';
    card.append(
      el('div', { class: 'rv-head' },
        el('span', {}, applied ? '✓ Applied' : label),
        el('span', { class: 'spacer' }),
        item ? el('button', {
          class: 'small', onclick: () => {
            if (diffBox.classList.toggle('hidden')) return;
            const html = diffWordsHtml(item.status === 'applied' && applied ? (item.history?.slice(-1)[0]?.text || item.text) : item.text, part.text);
            diffBox.innerHTML = html ?? '<em>Too long to compare.</em>';
          },
        }, 'Diff') : null,
        el('button', { class: 'small', onclick: () => { navigator.clipboard.writeText(part.text); toast('Copied'); } }, 'Copy'),
        item && !applied ? el('button', {
          class: 'small accent', onclick: () => {
            Pool.apply(item.id, part.text);
            msg.applied = [...(msg.applied || []), key];
            this.renderChat();
          },
        }, 'Apply') : null),
      el('div', { class: 'rv-body' }, part.text),
      diffBox);
    return card;
  },
};

</script>
  <script>/* js/links.js */
// =============================================================================
// links.js — songs and pictures linked to passages
// -----------------------------------------------------------------------------
// A link is just { kind, path, passage range } saved in project.json. The song
// or picture is NOT copied into the book and never appears in the manuscript
// or the PDF. If you move the file on disk, the link shows as missing and you
// can re-point it.
//
// "Auto-play" mode: as your cursor moves into a passage that has a song linked,
// Crucible starts that song — a soundtrack that follows you through the book.
// =============================================================================

const Links = {
  init() {
    trackAnchors(() => S.project.links, debounce(() => this.render(), 400));
    Bus.on('caret', debounce((pos) => this.onCaret(pos), 250));
    $('#ambientToggle').addEventListener('change', (e) => {
      S.project.meta.ambient = e.target.checked;
      markDirty(true);
      if (e.target.checked) this.onCaret(Editor.ta.selectionStart);
    });
    $('#stLinked').addEventListener('click', () => {
      const l = this._here;
      if (l) this.open(l);
    });
  },

  // Range to link: the selection, or the paragraph the cursor is in.
  targetRange() {
    const s = Editor.selection();
    if (s.end > s.start) return s;
    const p = TextOps.paragraphAt(Editor.text, s.start);
    return { start: p.start, end: p.end, text: Editor.text.slice(p.start, p.end) };
  },

  async startLink(kind) {
    const range = this.targetRange();
    if (!range.text.trim()) return toast('Put the cursor in a paragraph or highlight text first');
    const choose = (path, label) => {
      const chapter = Editor.chapterAt(range.start);
      S.project.links.push({
        id: uid(), kind, path, label: label || baseName(path),
        text: range.text, start: range.start, end: range.end,
        chapter: chapter ? chapter.title : '', created: Date.now(),
      });
      markDirty(true);
      this.render();
      toast(kind === 'song' ? 'Song linked to passage' : 'Picture linked to passage');
    };

    const list = el('div', { class: 'pick-list' });
    let modal;
    if (kind === 'song') {
      const songs = S.settings.playlist || [];
      if (!songs.length) list.append(el('div', { class: 'muted' }, 'Your playlist is empty — browse for a file instead.'));
      songs.forEach((s) => list.append(el('div', { class: 'mi', onclick: () => { choose(s.path, s.name); modal.close(); } }, '♪ ', s.name)));
    } else {
      const imgs = S.project.memory.filter((m) => m.kind === 'image');
      if (!imgs.length) list.append(el('div', { class: 'muted' }, 'No pictures in story memory — browse for a file instead.'));
      for (const m of imgs) {
        const img = el('img');
        Memory.pathOf(m).then(mediaUrl).then((u) => (img.src = u)).catch(() => {});
        list.append(el('div', {
          class: 'mi', onclick: async () => { choose(await Memory.pathOf(m), m.notes ? snippet(m.notes, 40) : m.name); modal.close(); },
        }, img, m.name));
      }
    }
    modal = openModal({
      title: kind === 'song' ? 'Link a song to this passage' : 'Link a picture to this passage',
      body: el('div', {}, el('p', { class: 'muted', style: 'font-family:var(--serif)' }, `“${snippet(range.text, 140)}”`), list),
      buttons: [
        { label: 'Cancel' },
        {
          label: 'Browse for a file…', accent: true,
          onClick: async () => {
            const f = asPick(kind === 'song' ? (await window.crucible.pickSongs())[0] : await window.crucible.pickImage());
            if (f) choose(f.path, f.name);
          },
        },
      ],
    });
  },

  async open(link) {
    if (!(await window.crucible.fileExists(link.path))) {
      return toast(`File not found: ${link.label}`, true);
    }
    if (link.kind === 'song') return Player.playPath(link.path, link.label);
    let src;
    try { src = await mediaUrl(link.path); } catch (e) { return toast(e.message, true); }
    openModal({
      cls: 'lightbox',
      body: el('div', {}, el('img', { src }), el('div', { class: 'cap' }, link.label)),
      buttons: [],
    });
  },

  goTo(link) {
    const pos = TextOps.locate(Editor.text, link);
    if (pos === null) return toast("Can't find the linked passage any more", true);
    link.start = pos; link.end = pos + link.text.length;
    Editor.reveal(link.start, link.end);
  },

  async repoint(link) {
    const p = asPick(link.kind === 'song' ? (await window.crucible.pickSongs())[0] : await window.crucible.pickImage());
    if (!p) return;
    link.path = p.path;
    link.label = p.name;
    markDirty(true);
    this.render();
  },

  remove(link) {
    S.project.links = S.project.links.filter((l) => l !== link);
    markDirty(true);
    this.render();
  },

  at(pos, kind) {
    return S.project.links.find((l) => (!kind || l.kind === kind) && pos >= l.start && pos <= l.end);
  },

  onCaret(pos) {
    const here = this.at(pos);
    this._here = here;
    const chip = $('#stLinked');
    if (here) {
      chip.classList.remove('hidden');
      chip.textContent = here.kind === 'song' ? `♪ ${here.label}` : `▣ ${here.label}`;
      chip.title = here.kind === 'song' ? 'Click to play the linked song' : 'Click to view the linked picture';
    } else chip.classList.add('hidden');

    if (S.project.meta.ambient) {
      const song = this.at(pos, 'song');
      if (song && Player.currentPath !== song.path) Player.playPath(song.path, song.label);
    }
  },

  async render() {
    const list = $('#linkList');
    $('#linkBadge').textContent = S.project.links.length;
    $('#ambientToggle').checked = !!S.project.meta.ambient;
    list.innerHTML = '';
    if (!S.project.links.length) {
      list.append(el('div', { class: 'empty' },
        'Right-click in the manuscript → "Link a song" or "Link a picture" to tie music or images to a scene. ',
        el('br'), el('br'), 'They are referenced, never embedded — they won\'t appear in the text or the PDF.'));
      return;
    }
    const sorted = [...S.project.links].sort((a, b) => a.start - b.start);
    for (const l of sorted) {
      const exists = await window.crucible.fileExists(l.path);
      list.append(el('div', { class: `card ${exists ? '' : 'missing'}` },
        el('div', { class: 'row' },
          el('span', { class: 'tag' }, l.kind === 'song' ? '♪ song' : '▣ picture'),
          el('span', { class: 'name', title: window.crucible.platform === 'web' ? l.label : l.path }, l.label),
          !exists ? el('span', { class: 'tag st-missing' }, 'file missing') : null),
        el('div', { class: 'snippet', onclick: () => this.goTo(l), title: 'Show in manuscript' }, l.text),
        el('div', { class: 'actions' },
          el('button', { class: 'small accent', disabled: !exists, onclick: () => this.open(l) }, l.kind === 'song' ? 'Play' : 'View'),
          el('button', { class: 'small', onclick: () => this.goTo(l) }, 'Go to'),
          el('button', { class: 'small', onclick: () => this.repoint(l) }, 'Change file'),
          window.crucible.platform === 'web' ? null : el('button', { class: 'small ghost', onclick: () => window.crucible.reveal(l.path) }, 'Show file'),
          el('button', { class: 'small ghost danger', onclick: () => this.remove(l) }, '✕'))));
    }
  },
};

  <script>/* js/player.js */
// =============================================================================
// player.js — built-in music player
// -----------------------------------------------------------------------------
// Plays files straight from where they live on your disk (MP3, M4A, OGG, WAV,
// FLAC, AAC). The playlist is a list of file paths saved in Crucible's global
// settings, so it's there no matter which book you open.
// =============================================================================

const Player = {
  audio: null,
  index: -1,
  currentPath: null,
  shuffle: false,
  repeat: false,
  seeking: false,

  init() {
    const a = (this.audio = $('#audio'));
    a.volume = S.settings.volume ?? 0.7;
    $('#plVol').value = a.volume;

    $('#plPlay').onclick = () => this.toggle();
    $('#plNext').onclick = () => this.next();
    $('#plPrev').onclick = () => (a.currentTime > 3 ? (a.currentTime = 0) : this.prev());
    $('#plShuffle').onclick = (e) => { this.shuffle = !this.shuffle; e.currentTarget.classList.toggle('on', this.shuffle); };
    $('#plRepeat').onclick = (e) => { this.repeat = !this.repeat; e.currentTarget.classList.toggle('on', this.repeat); };
    $('#plVol').oninput = (e) => { a.volume = +e.target.value; };
    $('#plVol').onchange = (e) => persistSettings({ volume: +e.target.value });
    $('#plListBtn').onclick = () => { $('#playlistPanel').classList.toggle('hidden'); this.render(); };
    $('#plAddFiles').onclick = async () => this.addPaths(await window.crucible.pickSongs());
    $('#plAddFolder').onclick = async () => this.addPaths(await window.crucible.pickMusicFolder());
    $('#plClear').onclick = async () => {
      if (await confirmModal('Clear playlist', 'Remove every song from the playlist? (Files on disk are untouched.)', 'Clear')) {
        await persistSettings({ playlist: [] });
        this.render();
      }
    };

    const seek = $('#plSeek');
    seek.addEventListener('input', () => { this.seeking = true; $('#plCur').textContent = fmtTime((seek.value / 1000) * a.duration); });
    seek.addEventListener('change', () => { a.currentTime = (seek.value / 1000) * a.duration; this.seeking = false; });
    a.addEventListener('timeupdate', () => {
      if (!this.seeking && a.duration) seek.value = (a.currentTime / a.duration) * 1000;
      if (!this.seeking) $('#plCur').textContent = fmtTime(a.currentTime);
    });
    a.addEventListener('loadedmetadata', () => ($('#plDur').textContent = fmtTime(a.duration)));
    a.addEventListener('play', () => ($('#plPlay').textContent = '❚❚'));
    a.addEventListener('pause', () => ($('#plPlay').textContent = '▶'));
    a.addEventListener('ended', () => (this.repeat ? (a.currentTime = 0, a.play()) : this.next()));
    a.addEventListener('error', () => { if (a.getAttribute('src')) toast(`Can't play ${$('#plTitle').textContent} — file missing or unsupported`, true); });

    // Space bar = play/pause when you're not typing somewhere.
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement.tagName)) {
        e.preventDefault(); this.toggle();
      }
    });
  },

  list() { return S.settings.playlist || []; },

  async addPaths(paths) {
    if (!paths.length) return;
    const existing = new Set(this.list().map((s) => s.path));
    const added = paths.map(asPick).filter((p) => !existing.has(p.path))
      .map((p) => ({ path: p.path, name: p.name.replace(/\.(mp3|m4a|ogg|wav|flac|aac)$/i, '') }));
    await persistSettings({ playlist: [...this.list(), ...added] });
    this.render();
    toast(`Added ${added.length} song(s)`);
  },

  load(i) {
    const s = this.list()[i];
    if (!s) return;
    this.index = i;
    this.playPath(s.path, s.name);
  },

  async playPath(p, name) {
    this.currentPath = p;
    const i = this.list().findIndex((s) => s.path === p);
    if (i !== -1) this.index = i;
    $('#plTitle').textContent = name || baseName(p);
    this.render();
    try {
      this.audio.src = await mediaUrl(p);
    } catch (e) {
      return toast(`Can't play ${name || 'that song'}: ${e.message}`, true, 5000);
    }
    this.audio.play().catch(() => {});
  },

  toggle() {
    if (!this.audio.src) { if (this.list().length) this.load(0); return; }
    this.audio.paused ? this.audio.play() : this.audio.pause();
  },

  next() {
    const n = this.list().length;
    if (!n) return;
    const i = this.shuffle ? Math.floor(Math.random() * n) : (this.index + 1) % n;
    this.load(i);
  },

  prev() {
    const n = this.list().length;
    if (!n) return;
    this.load((this.index - 1 + n) % n);
  },

  async removeAt(i) {
    const pl = [...this.list()];
    pl.splice(i, 1);
    await persistSettings({ playlist: pl });
    this.render();
  },

  async move(i, d) {
    const pl = [...this.list()];
    const j = i + d;
    if (j < 0 || j >= pl.length) return;
    [pl[i], pl[j]] = [pl[j], pl[i]];
    await persistSettings({ playlist: pl });
    this.render();
  },

  render() {
    const box = $('#playlist');
    if ($('#playlistPanel').classList.contains('hidden')) return;
    box.innerHTML = '';
    if (!this.list().length) {
      box.append(el('div', { class: 'empty' }, window.crucible.platform === 'web' && window.crucible.storageMode === 'browser' ? 'Add songs to play. In this browser they can only be remembered for the current session.' : 'Add songs or a whole music folder. They play from where they are — nothing is copied.'));
      return;
    }
    this.list().forEach((s, i) => box.append(el('div', {
      class: `pl-item ${s.path === this.currentPath ? 'cur' : ''}`, title: window.crucible.platform === 'web' ? s.name : s.path, ondblclick: () => this.load(i),
    },
    el('span', { class: 'nm', onclick: () => this.load(i) }, s.name),
    el('button', { class: 'ghost', title: 'Move up', onclick: () => this.move(i, -1) }, '↑'),
    el('button', { class: 'ghost', title: 'Move down', onclick: () => this.move(i, 1) }, '↓'),
    el('button', { class: 'ghost danger', title: 'Remove', onclick: () => this.removeAt(i) }, '✕'))));
  },
};

// =============================================================================
// export.js — book → PDF
// -----------------------------------------------------------------------------
// Builds a print-styled HTML version of the manuscript (book typography:
// justified text, first-line indents, chapters on new pages, scene breaks as
// centered asterisks) and hands it to Chromium's print-to-PDF in main.js.
// Linked songs/pictures and the change pool are never included.
// <!-- HTML comments --> in your Markdown can be left out, so you can keep
// private notes in the manuscript.
// =============================================================================

const Export = {
  FONTS: {
    garamond: '"EB Garamond", Garamond, "Adobe Garamond Pro", "Times New Roman", serif',
    palatino: '"Palatino Linotype", Palatino, "Book Antiqua", serif',
    georgia: 'Georgia, serif',
    times: '"Times New Roman", Times, serif',
    baskerville: 'Baskerville, "Baskerville Old Face", "Libre Baskerville", Georgia, serif',
  },

  defaults() {
    const firstH1 = Editor.outline.find((h) => h.level === 1);
    return {
      title: S.path ? baseName(S.path).replace(/\.[^.]+$/, '') : (firstH1 ? firstH1.title : 'Untitled'),
      author: '',
      pageSize: 'trade6x9',
      marginIn: 0.75,
      fontSize: 11.5,
      font: 'garamond',
      // One "# Title" with "## Chapter" headings under it → chapters are ##.
      breakLevel: Editor.outline.filter((h) => h.level === 1).length > 1 ? '1' : '2',
      titlePage: true,
      pageNumbers: true,
      stripComments: true,
      indent: true,
    };
  },

  open() {
    const o = Object.assign(this.defaults(), S.project.meta.export || {});
    const f = (label, input, hint) => el('div', { class: 'field' }, el('label', {}, label), input, hint ? el('div', { class: 'hint' }, hint) : null);
    const sel = (val, opts) => { const s = el('select'); opts.forEach(([v, t]) => s.append(el('option', { value: v }, t))); s.value = val; return s; };
    const chk = (v) => el('input', { type: 'checkbox', checked: v });

    const ui = {
      title: el('input', { value: o.title }),
      author: el('input', { value: o.author, placeholder: 'Your name' }),
      pageSize: sel(o.pageSize, [['trade6x9', 'Trade paperback 6 × 9 in'], ['digest55x85', 'Digest 5.5 × 8.5 in'], ['letter', 'US Letter 8.5 × 11 in'], ['a5', 'A5'], ['a4', 'A4']]),
      marginIn: el('input', { type: 'number', step: '0.05', min: '0.3', max: '2', value: o.marginIn }),
      font: sel(o.font, [['garamond', 'Garamond'], ['palatino', 'Palatino'], ['baskerville', 'Baskerville'], ['georgia', 'Georgia'], ['times', 'Times New Roman']]),
      fontSize: el('input', { type: 'number', step: '0.5', min: '8', max: '18', value: o.fontSize }),
      breakLevel: sel(o.breakLevel, [['1', 'Each # heading (chapters are #)'], ['2', 'Each ## heading (chapters are ##)'], ['0', 'Never']]),
      titlePage: chk(o.titlePage),
      pageNumbers: chk(o.pageNumbers),
      indent: chk(o.indent),
      stripComments: chk(o.stripComments),
    };

    openModal({
      title: 'Export book as PDF',
      body: el('div', {},
        f('Title', ui.title),
        f('Author', ui.author),
        f('Page size', ui.pageSize),
        f('Margins (inches)', ui.marginIn),
        f('Typeface', ui.font, 'Uses fonts installed on this computer.'),
        f('Font size (pt)', ui.fontSize),
        f('New page for', ui.breakLevel),
        f('Title page', ui.titlePage),
        f('Page numbers', ui.pageNumbers),
        f('Book-style indents', ui.indent, 'Indent paragraphs instead of spacing them (like a printed novel).'),
        f('Leave out comments', ui.stripComments, 'Skips <!-- notes --> you\'ve hidden in the manuscript.'),
        window.crucible.cssPaging ? el('p', { class: 'muted', style: 'font-size:12px;margin-top:14px' },
          'Your browser\'s print window will open. Choose "Save as PDF" as the destination, leave Margins on Default, and turn off "Headers and footers" if it shows.') : null),
      buttons: [
        { label: 'Cancel' },
        {
          label: 'Export…', accent: true,
          onClick: async () => {
            const opts = {
              title: ui.title.value, author: ui.author.value, pageSize: ui.pageSize.value,
              marginIn: +ui.marginIn.value, font: ui.font.value, fontSize: +ui.fontSize.value,
              breakLevel: ui.breakLevel.value, titlePage: ui.titlePage.checked, pageNumbers: ui.pageNumbers.checked,
              indent: ui.indent.checked, stripComments: ui.stripComments.checked,
            };
            S.project.meta.export = opts;
            markDirty(true);
            const web = !!window.crucible.cssPaging;
            toast(web ? 'Opening the print window…' : 'Building PDF…', false, 8000);
            const res = await window.crucible.exportPdf({
              html: this.buildHtml(Editor.text, { ...opts, cssPaging: web }),
              options: opts,
              suggestedName: `${opts.title || 'book'}.pdf`,
            });
            if (res?.printed) {
              toast('In the print window, choose "Save as PDF" as the printer.', false, 7000);
            } else if (res?.ok) {
              toast('PDF saved');
              window.crucible.reveal(res.path);
            } else if (!res?.canceled) toast('Export failed', true);
          },
        },
      ],
    });
  },

  buildHtml(md, o) {
    if (o.stripComments) md = md.replace(/<!--[\s\S]*?-->/g, '');
    const body = sanitizeHtml(marked.parse(md));
    const breaks = o.breakLevel === '0' ? '' : o.breakLevel === '2' ? 'h1, h2' : 'h1';
    const titlePage = o.titlePage
      ? `<section class="title-page"><div class="t">${escapeHtml(o.title)}</div>${o.author ? `<div class="a">${escapeHtml(o.author)}</div>` : ''}</section>`
      : '';
    // Browser printing: page size, margins and page numbers come from CSS @page.
    const sizes = { letter: 'letter', a4: 'A4', a5: 'A5', trade6x9: '6in 9in', digest55x85: '5.5in 8.5in' };
    const paging = o.cssPaging ? `
  @page { size: ${sizes[o.pageSize] || 'letter'}; margin: ${Number(o.marginIn) || 0.75}in;
    ${o.pageNumbers ? '@bottom-center { content: counter(page); font-family: Georgia, serif; font-size: 9pt; color: #444; }' : ''} }
  ${o.titlePage && o.pageNumbers ? '@page :first { @bottom-center { content: none; } }' : ''}` : '';
    return `<!doctype html><html><head><meta charset="utf-8"><title>${escapeHtml(o.title)}</title>
<style>${paging}
  html { -webkit-print-color-adjust: exact; }
  body { font-family: ${this.FONTS[o.font] || this.FONTS.garamond}; font-size: ${o.fontSize}pt; line-height: 1.45;
         color: #111; margin: 0; text-align: justify; hyphens: auto; -webkit-hyphens: auto; orphans: 2; widows: 2; }
  .title-page { height: ${o.cssPaging ? '90vh' : '85vh'}; display: flex; flex-direction: column; justify-content: center; text-align: center; break-after: page; }
  .title-page .t { font-size: 2.4em; letter-spacing: .04em; margin-bottom: .8em; }
  .title-page .a { font-size: 1.2em; font-style: italic; }
  h1, h2, h3 { text-align: center; font-weight: normal; break-after: avoid; hyphens: none; }
  h1 { font-size: 1.7em; margin: 2.5em 0 1.6em; letter-spacing: .03em; }
  h2 { font-size: 1.3em; margin: 2em 0 1em; }
  h3 { font-size: 1.1em; margin: 1.5em 0 .8em; font-style: italic; }
  ${breaks ? `${breaks} { break-before: page; } body > ${breaks.split(',')[0].trim()}:first-child { break-before: auto; }` : ''}
  .title-page + h1, .title-page + h2, h1 + h2 { break-before: auto; }
  p { margin: 0 0 ${o.indent ? '0' : '.8em'}; }
  ${o.indent ? 'p + p { text-indent: 1.5em; }' : ''}
  hr { border: 0; text-align: center; margin: 1.2em 0; break-after: avoid; }
  hr::after { content: "*  *  *"; letter-spacing: .4em; }
  blockquote { margin: 1em 2em; font-style: italic; }
  img { max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  pre, code { font-family: Consolas, "Courier New", monospace; font-size: .85em; white-space: pre-wrap; text-align: left; }
</style></head><body>${titlePage}${body}</body></html>`;
  },
};

// =============================================================================
// settings.js — AI providers & preferences
// -----------------------------------------------------------------------------
// Store as many AIs as you like and switch from the "AI" dropdown in the top
// bar. Three connection types cover almost everything:
//   Anthropic          Claude models
//   OpenAI-compatible  OpenAI, and anything that speaks the same API:
//                      Ollama / LM Studio (local, free), OpenRouter, Groq,
//                      Mistral, DeepSeek, xAI, Together…
//   Google Gemini      Gemini models
// API keys are encrypted with your operating system's keychain and never
// shown again after you save them.
// =============================================================================

const Settings = {
  PRESETS: [
    { name: 'Claude', type: 'anthropic', baseUrl: 'https://api.anthropic.com', model: 'claude-sonnet-5-5', needsKey: true },
    { name: 'OpenAI', type: 'openai', baseUrl: 'https://api.openai.com/v1', model: '', needsKey: true },
    { name: 'Google Gemini', type: 'gemini', baseUrl: 'https://generativelanguage.googleapis.com/v1beta', model: '', needsKey: true },
    { name: 'Ollama (local)', type: 'openai', baseUrl: 'http://localhost:11434/v1', model: '', needsKey: false },
    { name: 'LM Studio (local)', type: 'openai', baseUrl: 'http://localhost:1234/v1', model: '', needsKey: false },
    { name: 'OpenRouter', type: 'openai', baseUrl: 'https://openrouter.ai/api/v1', model: '', needsKey: true },
    { name: 'Groq', type: 'openai', baseUrl: 'https://api.groq.com/openai/v1', model: '', needsKey: true },
    { name: 'Custom (OpenAI-compatible)', type: 'openai', baseUrl: '', model: '', needsKey: true },
  ],

  open() {
    // Work on a copy; nothing is saved until you press Save.
    const draft = S.settings.providers.map((p) => ({ ...p }));
    let activeId = S.settings.activeProviderId || draft[0]?.id || null;
    const ui = { ...S.settings.ui };
    const listBox = el('div');

    const renderList = () => {
      listBox.innerHTML = '';
      if (!draft.length) listBox.append(el('div', { class: 'empty' }, 'No AIs yet. Add one below.'));
      draft.forEach((p, i) => {
        const field = (label, input, hint) => el('div', { class: 'field' }, el('label', {}, label), input, hint ? el('div', { class: 'hint' }, hint) : null);
        const inp = (key, attrs = {}) => {
          const n = el('input', { value: p[key] ?? '', ...attrs });
          n.addEventListener('input', () => (p[key] = n.value));
          return n;
        };
        const type = el('select');
        [['anthropic', 'Anthropic (Claude)'], ['openai', 'OpenAI-compatible'], ['gemini', 'Google Gemini']]
          .forEach(([v, t]) => type.append(el('option', { value: v }, t)));
        type.value = p.type;
        type.onchange = () => (p.type = type.value);
        const key = el('input', { type: 'password', placeholder: p.hasKey ? '•••••••• stored — type to replace' : 'Paste API key (leave blank for local servers)' });
        key.addEventListener('input', () => (p.newApiKey = key.value));
        const status = el('span', { class: 'muted' });

        listBox.append(el('div', { class: `prov-card ${p.id === activeId ? 'active' : ''}` },
          el('div', { class: 'row', style: 'display:flex;gap:8px;align-items:center;margin-bottom:4px' },
            el('label', { class: 'check' }, el('input', {
              type: 'radio', name: 'activeProv', checked: p.id === activeId,
              onchange: () => { activeId = p.id; renderList(); },
            }), 'Default'),
            el('strong', { style: 'flex:1' }, p.name || 'Unnamed'),
            status,
            el('button', {
              class: 'small', onclick: async () => {
                status.textContent = 'saving & testing…';
                await save();
                const r = await window.crucible.aiChat({
                  providerId: p.id, system: 'You are a connection test.',
                  messages: [{ role: 'user', content: 'Reply with the single word: ready' }],
                });
                status.textContent = r.ok ? `✓ ${snippet(r.text, 30)}` : `✕ ${snippet(r.error, 70)}`;
                status.style.color = r.ok ? 'var(--ok)' : 'var(--bad)';
              },
            }, 'Test'),
            el('button', { class: 'small ghost danger', onclick: () => { draft.splice(i, 1); if (activeId === p.id) activeId = draft[0]?.id || null; renderList(); } }, 'Remove')),
          field('Name', inp('name')),
          field('Connection type', type),
          field('Base URL', inp('baseUrl', { placeholder: 'https://…' })),
          field('Model', inp('model', { placeholder: p.type === 'anthropic' ? 'claude-sonnet-5-5' : 'model name from your provider' }),
            'The exact model ID from your provider\'s docs (for Ollama, run "ollama list").'),
          field('API key', key),
          field('Max reply tokens', inp('maxTokens', { type: 'number', placeholder: '4096' })),
          field('Temperature', inp('temperature', { type: 'number', step: '0.1', placeholder: 'provider default' })),
          field('Timeout (seconds)', inp('timeoutSec', { type: 'number', placeholder: '180' }), 'Raise this for slow local models.')));
      });
    };

    const presetSel = el('select');
    presetSel.append(el('option', { value: '' }, '+ Add an AI…'));
    this.PRESETS.forEach((p, i) => presetSel.append(el('option', { value: i }, p.name)));
    presetSel.onchange = () => {
      const pr = this.PRESETS[presetSel.value];
      presetSel.value = '';
      if (!pr) return;
      const p = { id: uid(), name: pr.name, type: pr.type, baseUrl: pr.baseUrl, model: pr.model, maxTokens: 4096, temperature: '', timeoutSec: pr.needsKey ? 180 : 600 };
      draft.push(p);
      if (!activeId) activeId = p.id;
      renderList();
    };

    const fontSize = el('input', { type: 'number', min: '12', max: '28', value: ui.fontSize });
    fontSize.oninput = () => { ui.fontSize = +fontSize.value; document.documentElement.style.setProperty('--editor-size', ui.fontSize + 'px'); };

    const save = async () => {
      await persistSettings({ providers: draft, activeProviderId: activeId, ui });
      // Re-sync the draft with what was stored (keys become "stored" flags).
      S.settings.providers.forEach((sp) => { const d = draft.find((x) => x.id === sp.id); if (d) { d.hasKey = sp.hasKey; delete d.newApiKey; } });
    };

    openModal({
      title: 'Settings',
      wide: true,
      body: el('div', {},
        el('h3', { style: 'margin:4px 0 8px;font-family:var(--serif);font-weight:500' }, 'AI providers'),
        el('p', { class: 'muted', style: 'margin-top:0' }, 'Add as many as you like and switch between them from the AI dropdown in the top bar.'),
        listBox,
        presetSel,
        el('h3', { style: 'margin:22px 0 8px;font-family:var(--serif);font-weight:500' }, 'Writing'),
        el('div', { class: 'field' }, el('label', {}, 'Editor text size (px)'), fontSize)),
      buttons: [{ label: 'Cancel', onClick: () => App.applyUi() }, { label: 'Save', accent: true, onClick: save }],
    });
    renderList();
  },
};

</script>
  <script>/* js/app.js */
// =============================================================================
// app.js — startup, file commands, tabs, keyboard shortcuts
// =============================================================================

const App = {
  async init() {
    S.settings = await window.crucible.getSettings();
    S.project = blankProject();
    this.applyUi();

    Editor.init();
    Pool.init();
    Memory.init();
    AI.init();
    Links.init();
    Player.init();

    AI.renderProviders();
    Editor.setView(S.settings.ui.view || 'edit');
    this.renderAll();
    this.bindTopbar();
    this.bindTabs();
    this.bindShortcuts();

    // Autosave every 2 minutes when the book has a file name.
    setInterval(() => { if (S.dirty && S.path) this.save(true); }, 120000);
    window.crucible.onSaveAndQuit(async () => {
      if (await this.save()) window.crucible.quitNow();
    });

    updateTitle();
    if (window.crucible.platform === 'web') {
      // Browsers only let a page touch your files after a click, so instead of
      // reopening silently we offer a one-click "welcome back".
      $('#btnDownload').classList.remove('hidden');
      this.welcome();
    } else if (S.settings.recent?.[0] && (await window.crucible.fileExists(S.settings.recent[0]))) {
      // Reopen the last book.
      this.openPath(S.settings.recent[0]).catch(() => {});
    }
  },

  async welcome() {
    const recent = [];
    for (const r of (S.settings.recent || []).slice(0, 6)) if (await window.crucible.fileExists(r)) recent.push(r);
    const body = el('div', {});
    let modal;
    if (recent.length) {
      body.append(el('p', { class: 'muted', style: 'margin-top:0' }, 'Pick up where you left off:'));
      const list = el('div', { class: 'pick-list' });
      recent.forEach((r) => list.append(el('div', {
        class: 'mi', onclick: () => { modal.close(); this.openPath(r).catch((e) => toast(e.message, true, 6000)); },
      }, el('strong', {}, baseName(r)), el('span', { class: 'muted', style: 'margin-left:auto;font-size:12px' }, r.split('/')[0]))));
      body.append(list);
      if (window.crucible.storageMode === 'folder') {
        body.append(el('p', { class: 'muted', style: 'font-size:12px' }, 'Your browser will ask once per session to allow access to the book\'s folder.'));
      }
    } else {
      body.append(
        el('p', { style: 'margin-top:0' }, 'Crucible keeps your book as a normal Markdown file on your computer.'),
        window.crucible.storageMode === 'folder'
          ? el('p', {}, 'Click ', el('strong', {}, 'Open book'), ' and choose the ', el('em', {}, 'folder'),
            ' that contains your manuscript. Crucible keeps its notes, memory and backups in a ', el('code', {}, 'YourBook.crucible'), ' folder next to it.')
          : el('p', {}, 'This browser can\'t edit files in place, so your book will be kept in the browser\'s own storage. Use ',
            el('strong', {}, 'Download .md'), ' to save a copy to your computer, and don\'t clear this browser\'s site data. Edge or Chrome can edit the file directly.'));
    }
    modal = openModal({
      title: recent.length ? 'Welcome back' : 'Welcome to Crucible',
      body,
      buttons: [
        { label: 'Start a new book', onClick: () => this.newBook() },
        { label: 'Open book…', accent: true, onClick: () => this.open() },
      ],
    });
  },

  download() {
    const name = S.path ? baseName(S.path) : 'Untitled.md';
    window.crucible.downloadText(name, Editor.text);
    toast(`Downloading ${name}`);
  },

  applyUi() {
    const ui = S.settings.ui;
    document.documentElement.dataset.theme = ui.theme || 'dark';
    $('#btnTheme').textContent = ui.theme === 'light' ? 'Dark' : 'Light';
    document.documentElement.style.setProperty('--editor-size', (ui.fontSize || 17) + 'px');
  },

  renderAll() {
    Pool.render();
    Memory.render();
    Links.render();
    AI.renderContext();
    AI.renderChat();
  },

  // -------------------------------------------------------------- files --
  async confirmDiscard() {
    if (!S.dirty) return true;
    return confirmModal('Unsaved changes', 'Discard unsaved changes to the current manuscript?', 'Discard');
  },

  loadBook(res) {
    S.path = res.path;
    S.sidecar = res.sidecar;
    S.project = Object.assign(blankProject(), res.project);
    S.project.meta = Object.assign({ negotiate: [] }, S.project.meta);
    Memory.cache = {};
    Editor.setText(res.text);
    // Offsets saved last time should match, but re-find anything that drifted
    // (e.g. if the .md was edited in another program).
    Bus.emit('relocate', { text: res.text, transform: (t) => t });
    S.lastSaved = null;
    markDirty(false);
    updateTitle();
    this.renderAll();
  },

  async open() {
    if (!(await this.confirmDiscard())) return;
    const res = await window.crucible.openBook();
    if (res) { this.loadBook(res); toast(`Opened ${baseName(res.path)}`); }
  },

  async openPath(p) {
    const res = await window.crucible.openBookPath(p);
    this.loadBook(res);
    toast(`Opened ${baseName(res.path)}`);
  },

  async newBook() {
    if (!(await this.confirmDiscard())) return;
    S.path = null;
    S.sidecar = null;
    S.project = blankProject();
    Editor.setText('# Title\n\n## Chapter One\n\n');
    markDirty(false);
    this.renderAll();
    updateTitle();
  },

  async save(quiet = false) {
    if (!S.path) return this.saveAs();
    try {
      const r = await window.crucible.saveBook({ bookPath: S.path, text: Editor.text, project: S.project });
      S.lastSaved = r.savedAt;
      markDirty(false);
      updateTitle();
      if (!quiet) toast('Saved');
      return true;
    } catch (e) {
      toast(`Save failed: ${e.message}`, true, 6000);
      return false;
    }
  },

  async saveAs() {
    const r = await window.crucible.saveBookAs({ text: Editor.text, project: S.project, currentPath: S.path });
    if (!r) return false;
    S.path = r.path;
    S.sidecar = r.sidecar;
    S.lastSaved = r.savedAt;
    Memory.cache = {};
    markDirty(false);
    updateTitle();
    this.renderAll();
    toast(`Saved as ${baseName(r.path)}`);
    return true;
  },

  async backups() {
    if (!S.path) return toast('Save the book first — backups are made on every save.');
    const names = await window.crucible.listBackups(S.path);
    if (!names.length) return toast('No backups yet. One is made each time you save.');
    const pre = el('pre', {}, 'Select a backup to preview it.');
    let chosen = null;
    const list = el('div', { class: 'list pick-list', style: 'padding:0' });
    names.forEach((n) => {
      const m = n.match(/_(\d{4}-\d\d-\d\d)T(\d\d)-(\d\d)-(\d\d)/);
      const label = m ? `${m[1]}  ${m[2]}:${m[3]}:${m[4]} UTC` : n;
      list.append(el('div', {
        class: 'mi', onclick: async (e) => {
          $$('.mi', list).forEach((x) => (x.style.borderColor = ''));
          e.currentTarget.style.borderColor = 'var(--ember)';
          chosen = await window.crucible.readBackup({ bookPath: S.path, name: n });
          pre.textContent = `${countWords(chosen).toLocaleString()} words\n\n${chosen.slice(0, 20000)}${chosen.length > 20000 ? '\n\n…' : ''}`;
        },
      }, label));
    });
    openModal({
      title: 'Restore from backup',
      wide: true,
      body: el('div', { class: 'backup-view' }, list, pre),
      buttons: [
        { label: 'Close' },
        {
          label: 'Restore into editor', accent: true,
          onClick: () => {
            if (!chosen) { toast('Pick a backup first'); return false; }
            Editor.replaceAll(chosen);
            toast('Backup restored — Ctrl+Z undoes, Save keeps it');
          },
        },
      ],
    });
  },

  async showRecent() {
    const dd = $('#btnRecent').parentElement;
    const menu = $('#recentMenu');
    menu.innerHTML = '';
    const rec = S.settings.recent || [];
    if (!rec.length) menu.append(el('div', { class: 'mi muted' }, 'No recent books'));
    rec.forEach((p) => menu.append(el('div', {
      class: 'mi', title: p, onclick: async () => {
        dd.classList.remove('open');
        if (!(await this.confirmDiscard())) return;
        this.openPath(p).catch((e) => toast(`Couldn't open: ${e.message}`, true));
      },
    }, baseName(p), el('span', { class: 'muted', style: 'margin-left:8px;font-size:11px' }, p))));
    dd.classList.toggle('open');
  },

  // ----------------------------------------------------------- UI wiring --
  bindTopbar() {
    $('#btnNew').onclick = () => this.newBook();
    $('#btnOpen').onclick = () => this.open();
    $('#btnSave').onclick = () => this.save();
    $('#btnSaveAs').onclick = () => this.saveAs();
    $('#btnBackups').onclick = () => this.backups();
    $('#btnDownload').onclick = () => this.download();
    $('#btnRecent').onclick = (e) => { e.stopPropagation(); this.showRecent(); };
    document.addEventListener('click', (e) => { if (!e.target.closest('.dropdown')) $$('.dropdown').forEach((d) => d.classList.remove('open')); });
    $('#btnFind').onclick = () => Editor.openFind();
    $('#btnExport').onclick = () => Export.open();
    $('#btnSettings').onclick = () => Settings.open();
    $('#btnTheme').onclick = () => {
      const t = S.settings.ui.theme === 'light' ? 'dark' : 'light';
      persistSettings({ ui: { ...S.settings.ui, theme: t } }).then(() => this.applyUi());
    };
  },

  bindTabs() {
    $$('.tabs').forEach((nav) => nav.querySelectorAll('button').forEach((b) =>
      b.addEventListener('click', () => this.showTab(nav.dataset.for, b.dataset.tab))));
  },

  showTab(side, tab) {
    const panel = $(`#${side}`);
    panel.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    panel.querySelectorAll('.tab').forEach((s) => s.classList.toggle('on', s.dataset.tab === tab));
  },

  bindShortcuts() {
    document.addEventListener('keydown', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      const k = e.key.toLowerCase();
      if (k === 's' && e.shiftKey) { e.preventDefault(); this.saveAs(); }
      else if (k === 's') { e.preventDefault(); this.save(); }
      else if (k === 'o') { e.preventDefault(); this.open(); }
      else if (k === 'f' || k === 'h') { e.preventDefault(); Editor.openFind(); }
      else if (k === 'e' && e.shiftKey) { e.preventDefault(); Export.open(); }
    });
  },
};

window.addEventListener('DOMContentLoaded', () => App.init().catch((e) => {
  console.error(e);
  toast(`Startup error: ${e.message}`, true, 10000);
}));

</script>
</body>
